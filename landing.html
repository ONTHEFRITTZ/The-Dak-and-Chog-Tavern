<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dak and Chog Tavern â€“ Enter</title>
  <!-- Load base CSS before JS to eliminate white flash on first paint -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Preload wallet logos to avoid flicker/missing due to late loads -->
  <link rel="preload" as="image" href="/assets/images/logos/metamask.png" type="image/png">
  <link rel="preload" as="image" href="/assets/images/logos/phantom.png" type="image/png">
  <style>
    /* Never show the network banner or top banner on landing */
    #network-banner, .top-banner { display: none !important; }
  </style>
</head>
<body class="age-landing">
  <main class="age-hero" role="main">
    <img class="age-logo" src="assets/images/sign.png" alt="The Dak and Chog Tavern">

    <section class="age-card" aria-labelledby="age-title" style="background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); box-shadow:0 24px 60px rgba(0,0,0,0.55); color:#ffffff;">
      <h1 id="age-title" class="visually-hidden">Age Confirmation</h1>
      <p class="age-warning" style="color:#ffffff;">There's gambling beyond these doors. Ye must be 19+ to enter!</p>
      <div class="age-cta">
        <button id="enter-tavern" aria-label="Confirm age and enter the tavern">I'm 19+, Let me in!</button>
      </div>
      <div id="wallet-choice" style="display:none; margin-top:14px;">
        <div style="margin-bottom:8px; font-weight:700;">Choose a wallet</div>
        <div style="display:flex; gap:18px; justify-content:center; flex-wrap:wrap;">
          <button id="btn-metamask" type="button" aria-label="Connect with MetaMask" title="MetaMask"
                  style="padding:10px; border-radius:12px; display:flex; align-items:center; justify-content:center; width:64px; height:64px; cursor:pointer; background:transparent; border:none; box-shadow:none;">
            <img id="logo-metamask" src="/assets/images/logos/metamask.png" alt="MetaMask" width="48" height="48" loading="eager" decoding="async" fetchpriority="high" style="width:48px; height:48px; object-fit:contain;"/>
          </button>
          <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
            <button id="btn-phantom" type="button" aria-label="Connect with Phantom" title="Phantom"
                    style="padding:10px; border-radius:12px; display:flex; align-items:center; justify-content:center; width:64px; height:64px; cursor:pointer; background:transparent; border:none; box-shadow:none;">
              <img id="logo-phantom" src="/assets/images/logos/phantom.png" alt="Phantom" width="48" height="48" loading="eager" decoding="async" fetchpriority="high" style="width:48px; height:48px; object-fit:contain;"/>
            </button>
            <div id="phantom-missing" style="display:none; font-size:12px;">
              Donâ€™t have Phantom? <a href="https://phantom.app/download" target="_blank" rel="noopener">Get Phantom</a>
            </div>
          </div>
        </div>
        <div id="wc-status" style="margin-top:8px; font-size:12px;"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <!-- Whitelist removed: no ABI preload needed -->
  <script type="module">
    (async()=>{
      try{
        const tag = (window.__BUILD_TAG ? String(window.__BUILD_TAG) : String(Date.now()));
        // Preload tavern module so connectWallet is ready synchronously in click handler
        await import(`./js/tavern.js?v=${encodeURIComponent(tag)}`);
      }catch(e){ /* ignore; pick() will report errors */ }
    })();
  </script>
  <script type="module">
    (function(){
      const btn = document.getElementById('enter-tavern');
      const chooser = document.getElementById('wallet-choice');
      const mm = document.getElementById('btn-metamask');
      const ph = document.getElementById('btn-phantom');
      const status = document.getElementById('wc-status');
      function showChooser(){
        try { chooser.style.display='block'; } catch {}
        try {
          const hasMetaMask = !!(window.ethereum && window.ethereum.request);
          const hasPhantom = !!(window.phantom && window.phantom.ethereum && window.phantom.ethereum.request);
          // Cache-bust logo src to avoid stale 404s after deploy
          const tag = (window.__BUILD_TAG ? String(window.__BUILD_TAG) : String(Date.now()));
          try { const mmimg = document.getElementById('logo-metamask'); if (mmimg) mmimg.src = '/assets/images/logos/metamask.png?v=' + encodeURIComponent(tag); } catch {}
          try { const phimg = document.getElementById('logo-phantom'); if (phimg) phimg.src = '/assets/images/logos/phantom.png?v=' + encodeURIComponent(tag); } catch {}
          if (!hasPhantom) {
            const pm = document.getElementById('phantom-missing');
            if (pm) pm.style.display = 'block';
          }
          if (!hasMetaMask) {
            const mmBtn = document.getElementById('btn-metamask');
            if (mmBtn) { mmBtn.disabled = true; mmBtn.title = 'MetaMask not detected'; }
          }
          if (!hasPhantom) {
            const phBtn = document.getElementById('btn-phantom');
            if (phBtn) { phBtn.disabled = false; phBtn.title = 'Phantom EVM not detected â€” install using the link below'; }
          }
        } catch {}
      }
      function pick(key){
  try { status.textContent = 'Connecting...'; } catch {}
  try {
    var fn = window.tavernConnectWallet;
    if (typeof fn !== 'function') {
  try {
    // Fallback: perform connection + signature directly using the selected provider
    var injected = (key==='phantom') ? (window.phantom&&window.phantom.ethereum) : (function(){ var eth=window.ethereum; if(!eth) return null; if(eth.isMetaMask) return eth; if(Array.isArray(eth.providers)) return eth.providers.find(function(p){return p&&p.isMetaMask;})||null; return eth; })();
    if (!injected || !injected.request) { status.textContent = 'Wallet not detected.'; return; }
    injected.request({ method:'eth_requestAccounts' }).then(function(acc){
      try {
        if (!Array.isArray(acc) || !acc.length) { status.textContent='No account'; return; }
        var ethers = window.ethers; if (!ethers || !ethers.providers) { status.textContent='Wallet libs not ready.'; return; }
        var provider = new ethers.providers.Web3Provider(injected, 'any');
        var signer = provider.getSigner();
        signer.getAddress().then(async function(addr){
          try {
            var ts=Date.now();
            var nonce=(Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).slice(0,24);
            var msg=`Dak & Chog Tavern\n\nSign-In: ${nonce}\nTime: ${new Date(ts).toISOString()}\nAddress: ${addr}\nWallet: ${key}`;
            var sig = await signer.signMessage(msg);
            var rec = ethers.utils.verifyMessage(msg, sig);
            if (!rec || String(rec).toLowerCase() !== String(addr).toLowerCase()) { status.textContent='Signature verification failed'; return; }
            try { sessionStorage.setItem('walletSigned','true'); sessionStorage.setItem('walletProvider', String(key)); sessionStorage.setItem('walletSig', sig); sessionStorage.setItem('walletMsg', msg); } catch{}
            var next='index.html?nav='+encodeURIComponent(String(Date.now())); window.location.replace(next);
          } catch(e){ status.textContent = (e&&e.message)? e.message : 'Signature required to enter'; }
        }).catch(function(){ status.textContent='Failed to read address'; });
      } catch(_) { status.textContent='Connect failed'; }
    }).catch(function(){ status.textContent='Login canceled. Please try again.'; });
  } catch(_) { status.textContent='Loader not ready. Reload and try again.'; }
  return;
}
    // Do not await imports or other async work before requesting accounts; keep click context
    Promise.resolve(fn(key)).then(function(){
      try {
        if (sessionStorage.getItem('walletSigned') === 'true') {
          var next = 'index.html?nav=' + encodeURIComponent(String(Date.now()));
          window.location.replace(next);
        } else {
          status.textContent = 'Signature required to enter. Please try again.';
        }
      } catch(_) {}
    }).catch(function(e){ try { status.textContent = (e && e.message) ? e.message : 'Failed to connect'; } catch(_){} });
  } catch(e){ try { status.textContent = 'Failed to connect'; } catch {} }
}
      if (btn) btn.addEventListener('click', showChooser);
      if (mm) mm.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); pick('metamask'); });
      if (ph) ph.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); pick('phantom'); });
      window.addEventListener('keydown', (e) => { if (e.key === 'Enter') { try { btn?.click(); } catch {} } });
      // No automatic prompts; user must click to pick a wallet
      // Defensive: remove any stray network banner if injected by cached scripts
      try { document.getElementById('network-banner')?.remove(); } catch {}
    })();
  </script>
</body>
</html>
