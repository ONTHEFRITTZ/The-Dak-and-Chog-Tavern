<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dak and Chog Tavern — Enter</title>
  <!-- Load base CSS before JS to eliminate white flash on first paint -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="age-landing">
  <main class="age-hero" role="main">
    <img class="age-logo" src="assets/images/sign.png" alt="The Dak and Chog Tavern">

    <section class="age-card" aria-labelledby="age-title" style="background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); box-shadow:0 24px 60px rgba(0,0,0,0.55); color:#ffffff;">
      <h1 id="age-title" class="visually-hidden">Age Confirmation</h1>
      <p class="age-warning" style="color:#ffffff;">There's gambling beyond these doors. Ye must be 19+ to enter!</p>
      <div class="age-cta">
        <button id="enter-tavern" aria-label="Confirm age and enter the tavern">I'm 19+, Let me in!</button>
      </div>
      <div id="wallet-choice" style="display:none; margin-top:14px;">
        <div style="margin-bottom:8px; font-weight:700;">Choose a wallet</div>
        <div style="display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
          <button id="btn-metamask" style="padding:10px 14px; border-radius:12px; display:flex; align-items:center; gap:8px;">
            <img src="./assets/images/logos/metamask.png" alt="MetaMask" style="width:24px; height:24px; object-fit:contain;"/>
            <span>MetaMask</span>
          </button>
          <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
            <button id="btn-phantom" style="padding:10px 14px; border-radius:12px; display:flex; align-items:center; gap:8px;">
              <img src="./assets/images/logos/phantom.png" alt="Phantom" style="width:24px; height:24px; object-fit:contain;"/>
              <span>Phantom</span>
            </button>
            <div id="phantom-missing" style="display:none; font-size:12px;">
              Don’t have Phantom? <a href="https://phantom.app/download" target="_blank" rel="noopener">Get Phantom</a>
            </div>
          </div>
        </div>
        <div id="wc-status" style="margin-top:8px; font-size:12px;"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script>
    (async()=>{ try{ const b=await fetch('/assets/build.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null); const tag=(b&&b.commit)?String(b.commit).slice(0,12):Date.now(); window.__BUILD_TAG=tag; const wl=document.createElement('script'); wl.src=`./js/WhitelistABI.js?v=${tag}`; document.head.appendChild(wl);}catch{}})();
  </script>
  <script type="module">
    import { detectChainId, getAddressFor } from './js/config.js';
    import { connectWallet } from './js/tavern.js';
    (function(){
      const btn = document.getElementById('enter-tavern');
      const chooser = document.getElementById('wallet-choice');
      const mm = document.getElementById('btn-metamask');
      const ph = document.getElementById('btn-phantom');
      const status = document.getElementById('wc-status');
      function showChooser(){
        try { chooser.style.display='block'; } catch {}
        try {
          const hasMetaMask = !!(window.ethereum && window.ethereum.request);
          const hasPhantom = !!(window.phantom && window.phantom.ethereum && window.phantom.ethereum.request);
          if (!hasPhantom) {
            const pm = document.getElementById('phantom-missing');
            if (pm) pm.style.display = 'block';
          }
          if (!hasMetaMask) {
            const mmBtn = document.getElementById('btn-metamask');
            if (mmBtn) { mmBtn.disabled = true; mmBtn.title = 'MetaMask not detected'; }
          }
          if (!hasPhantom) {
            const phBtn = document.getElementById('btn-phantom');
            if (phBtn) { phBtn.disabled = false; phBtn.title = 'Phantom EVM not detected — install using the link below'; }
          }
        } catch {}
      }
      async function pick(key){
        try { status.textContent = 'Connecting...'; } catch {}
        try { localStorage.setItem('walletProvider', key); sessionStorage.setItem('walletProvider', key); } catch {}
        try {
          await connectWallet(key);
          try { sessionStorage.setItem('walletConnected','true'); localStorage.setItem('walletConnected','true'); } catch {}
          window.location.href = 'index.html';
        } catch(e){ try { status.textContent = 'Failed to connect: ' + (e?.message||''); } catch {} }
      }
      if (btn) btn.addEventListener('click', showChooser);
      if (mm) mm.addEventListener('click', () => pick('metamask'));
      if (ph) ph.addEventListener('click', () => pick('phantom'));
      window.addEventListener('keydown', (e) => { if (e.key === 'Enter') { try { btn?.click(); } catch {} } });
      // No automatic prompts; user must click to pick a wallet
    })();
  </script>
</body>
</html>
