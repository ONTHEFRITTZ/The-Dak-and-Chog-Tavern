<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dak and Chog Tavern â€“ Enter</title>
  <!-- Load base CSS before JS to eliminate white flash on first paint -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Preload wallet logos to avoid flicker/missing due to late loads -->
  <link rel="preload" as="image" href="/assets/images/logos/metamask.png" type="image/png">
  <link rel="preload" as="image" href="/assets/images/logos/phantom.png" type="image/png">
  <style>
    /* Never show the network banner or top banner on landing */
    #network-banner, .top-banner { display: none !important; }
  </style>
</head>
<body class="age-landing">
  <main class="age-hero" role="main">
    <img class="age-logo" src="assets/images/sign.png" alt="The Dak and Chog Tavern">

    <section class="age-card" aria-labelledby="age-title" style="background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); box-shadow:0 24px 60px rgba(0,0,0,0.55); color:#ffffff;">
      <h1 id="age-title" class="visually-hidden">Age Confirmation</h1>
      <p class="age-warning" style="color:#ffffff;">There's gambling beyond these doors. Ye must be 19+ to enter!</p>
      <div class="age-cta">
        <button id="enter-tavern" aria-label="Confirm age and enter the tavern">I'm 19+, Let me in!</button>
      </div>
      <div id="wallet-choice" style="display:none; margin-top:14px;">
        <div style="margin-bottom:8px; font-weight:700;">Choose a wallet</div>
        <div style="display:flex; gap:18px; justify-content:center; flex-wrap:wrap;">
          <button id="btn-metamask" type="button" aria-label="Connect with MetaMask" title="MetaMask"
                  style="padding:10px; border-radius:12px; display:flex; align-items:center; justify-content:center; width:64px; height:64px; cursor:pointer; background:transparent; border:none; box-shadow:none;">
            <img id="logo-metamask" src="/assets/images/logos/metamask.png" alt="MetaMask" width="48" height="48" loading="eager" decoding="async" fetchpriority="high" style="width:48px; height:48px; object-fit:contain;"/>
          </button>
          <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
            <button id="btn-phantom" type="button" aria-label="Connect with Phantom" title="Phantom"
                    style="padding:10px; border-radius:12px; display:flex; align-items:center; justify-content:center; width:64px; height:64px; cursor:pointer; background:transparent; border:none; box-shadow:none;">
              <img id="logo-phantom" src="/assets/images/logos/phantom.png" alt="Phantom" width="48" height="48" loading="eager" decoding="async" fetchpriority="high" style="width:48px; height:48px; object-fit:contain;"/>
            </button>
            <div id="phantom-missing" style="display:none; font-size:12px;">
              Donâ€™t have Phantom? <a href="https://phantom.app/download" target="_blank" rel="noopener">Get Phantom</a>
            </div>
          </div>
        </div>
        <div id="wc-status" style="margin-top:8px; font-size:12px;"></div>
        <div id="react-wallet-root"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <!-- Whitelist removed: no ABI preload needed -->
  
    
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script type="module">
    (async()=>{
      try{
        const b = await fetch('/assets/build.json', { cache:'no-store' }).then(r=>r.ok?r.json():null).catch(()=>null);
        window.__BUILD_TAG = (b && b.commit) ? String(b.commit).slice(0,12) : String(Date.now());
      }catch{}
    })();
  </script>
  <script type="module">
    (function(){
      const btn = document.getElementById('enter-tavern');
      const chooser = document.getElementById('wallet-choice');
      function showChooser(){ try{ chooser.style.display='block'; }catch{} }
      if (btn) btn.addEventListener('click', showChooser);
      window.addEventListener('keydown', (e) => { if (e.key === 'Enter') { try { btn?.click(); } catch {} } });
      try { document.getElementById('network-banner')?.remove(); } catch {}
    })();
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    (function(){
      const { useEffect, useState } = React;
      function LandingWallet(){
        const [mounted,setMounted] = useState(false);
        useEffect(()=>{
          if (mounted) return; setMounted(true);
          const status = document.getElementById('wc-status');
          const discovered = [];
          function onAnnounce(ev){ try{ const d=ev&&ev.detail; if(d&&d.info&&d.provider){ discovered.push(d); } }catch{} }
          try {
            window.addEventListener('eip6963:announceProvider', onAnnounce);
            window.dispatchEvent(new Event('eip6963:requestProvider'));
            setTimeout(()=>{ try{ window.removeEventListener('eip6963:announceProvider', onAnnounce); }catch{} }, 200);
          } catch {}
          function pickDiscovered(name){ try{ var re=new RegExp(name,'i'); var hit=discovered.find(function(d){ return re.test(d&&d.info&&d.info.name||'') || re.test(d&&d.info&&d.info.rdns||''); }); return hit? hit.provider : null; } catch { return null } }
          async function doPick(key){
            try{ if(status) status.textContent='Connecting...'; }catch{}
            try{
              var prov=null;
              if (key==='metamask'){
                var eth = window.ethereum; prov = pickDiscovered('metamask') || (eth&&eth.isMetaMask? eth : (Array.isArray(eth&&eth.providers)? eth.providers.find(function(p){return p&&p.isMetaMask;}) : eth));
              } else if (key==='phantom'){
                prov = pickDiscovered('phantom') || (window.phantom && window.phantom.ethereum) || null;
              }
              if (!prov || typeof prov.request !== 'function') throw new Error('Wallet not detected');
              try { await prov.request({ method:'wallet_switchEthereumChain', params:[{ chainId: '0x279f' }] }); }
              catch(e){ if (e && (e.code===4902 || /unknown chain/i.test(String(e.message)))){ await prov.request({ method:'wallet_addEthereumChain', params:[{ chainId:'0x279f', chainName:'Monad Testnet', nativeCurrency:{ name:'MON', symbol:'MON', decimals:18 }, rpcUrls:['https://testnet-rpc.monad.xyz'], blockExplorerUrls:['https://testnet.monadexplorer.com','https://testnet.monadscan.com'] }] }); await prov.request({ method:'wallet_switchEthereumChain', params:[{ chainId: '0x279f' }] }); } else { throw e; } }
              var accs = await prov.request({ method:'eth_requestAccounts' }); if (!Array.isArray(accs) || !accs.length) throw new Error('No account'); var addr = accs[0];
              var ts = Date.now(); var nonce = (Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).slice(0,24);
              var msg = 'Dak & Chog Tavern\n\nSign-In: '+nonce+'\nTime: '+new Date(ts).toISOString()+'\nAddress: '+addr+'\nWallet: '+key;
              var sig = await prov.request({ method:'personal_sign', params:[msg, addr] });
              try { sessionStorage.setItem('walletSigned','true'); sessionStorage.setItem('walletProvider', key); sessionStorage.setItem('walletMsg', msg); sessionStorage.setItem('walletSig', sig); } catch {}
              window.location.replace('index.html?nav='+encodeURIComponent(String(Date.now())));
            }catch(e){ try{ if (status) status.textContent = (e&&e.message) || 'Failed to connect'; }catch{} }
          }
          var mm = document.getElementById('btn-metamask'); var ph = document.getElementById('btn-phantom');
          if (mm) mm.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); doPick('metamask'); });
          if (ph) ph.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); doPick('phantom'); });
          return function(){ try{ if (mm) mm.replaceWith(mm.cloneNode(true)); if (ph) ph.replaceWith(ph.cloneNode(true)); }catch{} };
        },[mounted]);
        return null;
      }
      try { var rootEl=document.getElementById('react-wallet-root'); if (rootEl) { var root=ReactDOM.createRoot(rootEl); root.render(React.createElement(LandingWallet)); } } catch{}
    })();
  </script></body>
</html>
