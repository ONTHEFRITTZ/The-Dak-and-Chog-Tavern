<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dak and Chog Tavern — Enter</title>
  <script>
    (async()=>{
      try{
        const b = await fetch('/assets/build.json', { cache:'no-store' }).then(r=>r.ok?r.json():null).catch(()=>null);
        const tag = (b && b.commit) ? String(b.commit).slice(0,12) : Date.now();
        const css = document.createElement('link'); css.rel='stylesheet'; css.href = `css/style.css?v=${tag}`; document.head.appendChild(css);
      }catch(e){ console.error('head loader failed', e); }
    })();
  </script>
</head>
<body class="age-landing">
  <main class="age-hero" role="main">
    <img class="age-logo" src="assets/images/sign.png" alt="The Dak and Chog Tavern">

    <section class="age-card" aria-labelledby="age-title">
      <h1 id="age-title" class="visually-hidden">Age Confirmation</h1>
      <p class="age-warning">There's gambling beyond these doors. Ye must be 19+ to enter!</p>
      <div class="age-cta">
        <button id="enter-tavern" aria-label="Confirm age and enter the tavern">I'm 19+, Let me in!</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script>
    (async()=>{ try{ const b=await fetch('/assets/build.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null); const tag=(b&&b.commit)?String(b.commit).slice(0,12):Date.now(); window.__BUILD_TAG=tag; const wl=document.createElement('script'); wl.src=`./js/WhitelistABI.js?v=${tag}`; document.head.appendChild(wl);}catch{}})();
  </script>
  <script type="module">
    import { detectChainId, getAddressFor } from './js/config.js';
    (function(){
      const btn = document.getElementById('enter-tavern');
      async function proceed(){
        // Require wallet connection
        if (!window.ethereum || !window.ethereum.request) { alert('MetaMask not detected.'); return; }
        try {
          await window.ethereum.request({ method: 'eth_requestAccounts' });
          const provider = new ethers.providers.Web3Provider(window.ethereum,'any');
          const signer = provider.getSigner();
          const wallet = await signer.getAddress();
          try { localStorage.setItem('walletConnected','true'); sessionStorage.setItem('walletConnected','true'); } catch {}
          // Optional whitelist
          try {
            const wlAddr = await getAddressFor('whitelist', provider);
            if (wlAddr && window.WhitelistABI) {
              const c = new ethers.Contract(wlAddr, window.WhitelistABI, provider);
              const ok = await c.isAllowed(wallet);
              if (!ok) { alert('This wallet is not whitelisted for early access.'); return; }
            }
          } catch {}
          window.location.href = 'index.html';
        } catch (e) {
          // user rejected or error
        }
      }
      if (btn) btn.addEventListener('click', proceed);
      window.addEventListener('keydown', (e) => { if (e.key === 'Enter') { try { btn?.click(); } catch {} } });
      // Best-effort auto state if already authorized
      (async () => { try { const provider = window.ethereum? new ethers.providers.Web3Provider(window.ethereum,'any'):null; if (provider){ const acc=await provider.listAccounts(); if (acc && acc.length){ localStorage.setItem('walletConnected','true'); } } } catch {} })();
    })();
  </script>
</body>
</html>
