<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Dak & Chog Tavern — Enter</title>

  <link rel="stylesheet" href="/css/style.css" />

  <style>
    /* Hide any site chrome on landing */
    .top-banner, #network-banner, #nb-top-info, .contract-pill, #sidebar {
      display: none !important; visibility: hidden !important;
    }

    /* Fail-safe visuals even if style.css is cached weirdly */
    body.age-landing {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: url('/assets/images/tavern-bg.webp') no-repeat center/cover fixed;
      margin: 0; text-align: center; font-family: 'Morris','Morris Alt',serif;
    }
    .age-card {
      background: var(--panel-bg-soft);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,.55);
      padding: 22px;
      width: min(92%, 820px);
      color: #f4e6d3;
    }
    .age-warning { margin: 0 0 12px; font-size: clamp(16px,2.2vw,22px); color: #fff; }
    .age-cta button { padding: 12px 22px; font-size: 18px; border-radius: 10px; }
    #wallet-choice { margin-top: 14px; display: none; }
    #wc-status { margin-top: 12px; font-size: 14px; color: #f4e6d3; min-height: 1.2em; }
    #wallet-choice button { cursor: pointer; }
    .hint { font-size: 12px; opacity: .9; margin-top: 6px; }
  </style>
</head>

<body class="age-landing">
  <main class="age-hero" aria-label="Age Confirmation">
    <section class="age-card" aria-labelledby="age-title">
      <h1 id="age-title" class="visually-hidden">Age Confirmation</h1>

      <p class="age-warning">
        There's gambling beyond these doors. Ye must be 19+ to enter!
      </p>

      <div class="age-cta">
        <button id="enter-tavern" aria-label="Confirm age and enter the tavern">
          I'm 19+, Let me in!
        </button>
      </div>

      <!-- Wallet choice row (hidden until “Let me in!” is clicked) -->
      <div id="wallet-choice">
        <div style="margin-bottom:8px; font-weight:700;">Choose a wallet</div>

        <div style="display:flex; gap:18px; justify-content:center; flex-wrap:wrap;">
          <!-- MetaMask only (keep Phantom out to reduce conflicts) -->
          <button id="btn-metamask" type="button" aria-label="Connect with MetaMask" title="MetaMask"
            style="padding:10px; border-radius:12px; display:flex; align-items:center; justify-content:center; width:64px; height:64px; background:transparent; border:none; box-shadow:none;">
            <img src="/assets/images/logos/metamask.png" alt="MetaMask" width="48" height="48"
              loading="eager" decoding="async" fetchpriority="high"
              style="width:48px; height:48px; object-fit:contain;" />
          </button>
        </div>

        <div id="wc-status"></div>
        <div class="hint" id="pending-hint" style="display:none;">
          Request sent — if you don’t see the popup, click the MetaMask extension icon in your browser toolbar.
        </div>
      </div>
    </section>
  </main>

  <script>
    // Basic DOM helpers
    const $ = id => document.getElementById(id);
    const statusEl = $("wc-status");
    const pendingHint = $("pending-hint");

    function setStatus(msg) {
      if (statusEl) statusEl.textContent = msg || "";
    }

    // Resolve the real MetaMask provider (handles multi-inject environments)
    function getMetaMaskProvider() {
      const eth = window.ethereum;
      if (!eth) return null;
      if (eth.isMetaMask) return eth;
      if (Array.isArray(eth.providers)) {
        const mm = eth.providers.find(p => p && p.isMetaMask);
        if (mm) return mm;
      }
      // Brave sometimes hides MM under _events; last resort is the base object
      return eth;
    }

    async function connectMetaMask() {
      const mm = getMetaMaskProvider();
      if (!mm || !mm.request) {
        setStatus("MetaMask not detected. Please install the extension.");
        return;
      }

      setStatus("Connecting to MetaMask…");
      pendingHint.style.display = "none";

      try {
        // Ensure we're not inside an iframe (extension popups won't open)
        if (window.top !== window.self) {
          throw new Error("This page is inside an iframe. Open it in a new tab.");
        }

        // Primary request that triggers the popup
        const accounts = await mm.request({ method: "eth_requestAccounts" });

        const addr = (accounts && accounts[0]) ? String(accounts[0]) : null;
        if (!addr) throw new Error("No account returned.");

        // Persist flags used by the rest of your app
        try {
          sessionStorage.setItem("walletSigned", "true");
          sessionStorage.setItem("walletConnected", "true");
          sessionStorage.setItem("walletAddress", addr);
          localStorage.setItem("walletConnected", "true");
          localStorage.setItem("walletAddress", addr);
        } catch {}

        setStatus("");
        // Optional: redirect to home or lobby
        // location.href = "/index.html";
      } catch (err) {
        // -32002 = request already pending (user must click the extension icon)
        if (err && (err.code === -32002 || String(err.message || "").toLowerCase().includes("request already pending"))) {
          setStatus("MetaMask request already pending.");
          pendingHint.style.display = "block";
          return;
        }
        // 4001 = user rejected
        if (err && err.code === 4001) {
          setStatus("MetaMask request canceled.");
          return;
        }
        setStatus(err && err.message ? ("MetaMask error: " + err.message) : "MetaMask error.");
        console.error("MetaMask connect error:", err);
      }
    }

    // Show wallet selectors after age confirm
    $("enter-tavern")?.addEventListener("click", () => {
      setStatus("");
      $("wallet-choice").style.display = "block";
      try { sessionStorage.setItem("ageConfirmed", "true"); } catch {}
    });

    // MetaMask button – make the request directly in this click handler
    $("btn-metamask")?.addEventListener("click", () => {
      // IMPORTANT: call inside the handler — Chrome blocks popups otherwise
      connectMetaMask();
    });
  </script>
</body>
</html>
