<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Dak & Chog Tavern — Enter</title>

  <link rel="stylesheet" href="/css/style.css" />

  <style>
    /* Hide any network/contract pills or headers on landing */
    .top-banner, #network-banner, #nb-top-info, .contract-pill, #sidebar {
      display: none !important; visibility: hidden !important;
    }

    body.age-landing {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: url('/assets/images/tavern-bg.webp') no-repeat center/cover fixed;
      margin: 0; text-align: center; font-family: 'Morris','Morris Alt',serif;
    }
    .age-card {
      background: var(--panel-bg-soft);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,.55);
      padding: 22px;
      width: min(92%, 820px);
      color: #f4e6d3;
    }
    .age-warning { margin: 0 0 12px; font-size: clamp(16px,2.2vw,22px); color: #fff; }
    .age-cta button { padding: 12px 22px; font-size: 18px; border-radius: 10px; }
    #wallet-choice { margin-top: 14px; display: none; }
    #wc-status { margin-top: 12px; font-size: 14px; color: #f4e6d3; min-height: 1.2em; }
    .hint { font-size: 12px; opacity: .9; margin-top: 6px; }
    .row { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; align-items:center; }
    .wallet-btn {
      padding:10px; border-radius:12px; display:flex; align-items:center; justify-content:center;
      width:64px; height:64px; background:transparent; border:none; box-shadow:none;
      transition: transform .06s ease;
    }
    .wallet-btn:active { transform: translateY(1px); }
    .wallet-btn[disabled] { opacity:.6; pointer-events:none; }
    .subnote { font-size: 12px; margin-top: 6px; }
  </style>

  <!-- Pin the chosen wallet as early as possible on this page too -->
  <script src="/js/provider-pin.js"></script>
</head>

<body class="age-landing">
  <main class="age-hero" aria-label="Age Confirmation">
    <section class="age-card" aria-labelledby="age-title">
      <h1 id="age-title" class="visually-hidden">Age Confirmation</h1>

      <p class="age-warning">
        There's gambling beyond these doors. Ye must be 19+ to enter!
      </p>

      <div class="age-cta">
        <button id="enter-tavern" aria-label="Confirm age and enter the tavern">
          I'm 19+, Let me in!
        </button>
      </div>

      <div id="wallet-choice">
        <div style="margin-bottom:8px; font-weight:700;">Choose a wallet</div>

        <div class="row">
          <!-- MetaMask -->
          <button id="btn-metamask" type="button" class="wallet-btn"
                  aria-label="Connect with MetaMask" title="MetaMask">
            <img src="/assets/images/logos/metamask.png" alt="MetaMask" width="48" height="48"
                 loading="eager" decoding="async" fetchpriority="high"
                 style="width:48px; height:48px; object-fit:contain;" />
          </button>

          <!-- Phantom (EVM) -->
          <div style="display:flex; flex-direction:column; align-items:center;">
            <button id="btn-phantom" type="button" class="wallet-btn"
                    aria-label="Connect with Phantom" title="Phantom (EVM)">
              <img src="/assets/images/logos/phantom.png" alt="Phantom" width="48" height="48"
                   loading="eager" decoding="async" fetchpriority="high"
                   style="width:48px; height:48px; object-fit:contain;" />
            </button>
            <div id="phantom-missing" class="subnote" style="display:none;">
              Don’t have Phantom? <a href="https://phantom.app/download" target="_blank" rel="noopener">Get Phantom</a>
            </div>
          </div>
        </div>

        <div id="wc-status"></div>
        <div class="hint" id="pending-hint" style="display:none;">
          Request sent — if you don’t see the popup, click the wallet’s extension icon in your browser toolbar.
        </div>
      </div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const statusEl = $("wc-status");
    const pendingHint = $("pending-hint");
    const btnMM = $("btn-metamask");
    const btnPH = $("btn-phantom");
    const phMissing = $("phantom-missing");

    function setStatus(msg) { statusEl.textContent = msg || ""; }
    function lock(btn, on) { if (btn) btn.disabled = !!on; }
    function redirectHome() { location.replace("/index.html"); }
    function markSigned(addr, which) {
      try {
        sessionStorage.setItem("walletSigned", "true");
        sessionStorage.setItem("walletConnected", "true");
        sessionStorage.setItem("walletAddress", addr);
        localStorage.setItem("walletConnected", "true");
        localStorage.setItem("walletAddress", addr);
        // >>> THIS is the sticky choice <<<
        sessionStorage.setItem("walletProvider", which);
        localStorage.setItem("walletProvider", which);
        // Also tell provider-pin live on this page
        if (window.walletChoice?.save) window.walletChoice.save(which);
      } catch {}
    }

    function getMetaMaskProvider() {
      const eth = window.ethereumAll?.metamask || (window.ethereum?.isMetaMask ? window.ethereum : null);
      if (eth) return eth;
      if (Array.isArray(window.ethereumAll?.providers)) {
        const mm = window.ethereumAll.providers.find(p => p && p.isMetaMask);
        if (mm) return mm;
      }
      return null;
    }
    function getPhantomEvmProvider() {
      const ph = window?.phantom?.ethereum;
      return (ph && typeof ph.request === "function") ? ph : null;
    }

    async function ensureAccount(provider, walletName) {
      try {
        const pre = await provider.request({ method: "eth_accounts" });
        if (Array.isArray(pre) && pre[0]) return pre[0];
      } catch {}
      try {
        const accs = await provider.request({ method: "eth_requestAccounts" });
        return (accs && accs[0]) || null;
      } catch (err) {
        if (err && (err.code === -32002 ||
            String(err.message||"").toLowerCase().includes("request already pending"))) {
          setStatus(`${walletName} request already pending.`);
          pendingHint.style.display = "block";
          return null;
        }
        if (err && err.code === 4001) { setStatus(`${walletName} request canceled.`); return null; }
        setStatus(err?.message ? `${walletName} error: ${err.message}` : `${walletName} error.`);
        console.error(`${walletName} connect error:`, err);
        return null;
      }
    }

    async function connectMetaMask() {
      pendingHint.style.display = "none";
      const mm = getMetaMaskProvider();
      if (!mm) { setStatus("MetaMask not detected. Please install the extension."); return; }
      if (window.top !== window.self) { setStatus("Open this page in a tab (not an iframe)."); return; }

      lock(btnMM, true); setStatus("Connecting to MetaMask…");
      const addr = await ensureAccount(mm, "MetaMask");
      lock(btnMM, false);
      if (addr) { markSigned(addr, "metamask"); redirectHome(); }
    }

    async function connectPhantom() {
      pendingHint.style.display = "none";
      const ph = getPhantomEvmProvider();
      if (!ph) { setStatus("Phantom (EVM) not detected."); if (phMissing) phMissing.style.display = "block"; return; }
      if (window.top !== window.self) { setStatus("Open this page in a tab (not an iframe)."); return; }

      lock(btnPH, true); setStatus("Connecting to Phantom…");
      const addr = await ensureAccount(ph, "Phantom");
      lock(btnPH, false);
      if (addr) { markSigned(addr, "phantom"); redirectHome(); }
    }

    // Reveal wallet choices after age confirm
    $("enter-tavern")?.addEventListener("click", () => {
      setStatus(""); $("wallet-choice").style.display = "block";
      try { sessionStorage.setItem("ageConfirmed", "true"); } catch {}
      const hasPh = !!getPhantomEvmProvider();
      if (!hasPh && phMissing) phMissing.style.display = "block";
    });

    // If an approval happens later (user clicks extension icon), finish the flow
    function wireAccountsChanged(provider, name, tag) {
      if (!provider || typeof provider.on !== "function") return;
      provider.on("accountsChanged", (accs) => {
        if (Array.isArray(accs) && accs[0]) { markSigned(accs[0], tag); redirectHome(); }
      });
    }
    wireAccountsChanged(getMetaMaskProvider(), "MetaMask", "metamask");
    wireAccountsChanged(getPhantomEvmProvider(), "Phantom", "phantom");

    // Button handlers
    $("btn-metamask")?.addEventListener("click", connectMetaMask);
    $("btn-phantom")?.addEventListener("click", connectPhantom);
  </script>
</body>
</html>
