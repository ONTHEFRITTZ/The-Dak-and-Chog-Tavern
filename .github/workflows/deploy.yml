name: Deploy static site to EC2

on:
  push:
    branches: [ "main" ]
    paths:
      - "**.html"
      - "admin/**"
      - "games/**"
      - "css/**"
      - "js/**"
      - "images/**"
      - "img/**"
      - "assets/**"
      - "fonts/**"
      - "media/**"
      - "**.ico"
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "**.svg"
      - "**.webp"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://thedakandchog.xyz
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write build metadata
        run: |
          set -e
          mkdir -p assets
          echo "{\"commit\":\"${GITHUB_SHA}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > assets/build.json

      - name: Create site tarball
        run: |
          set -e
          echo "Packing repository into site.tgz (excluding VCS/CI)"
          tar --exclude-vcs --exclude=.github -czf site.tgz .

      - name: Verify package exists
        run: |
          set -e
          ls -l site.tgz || (echo "site.tgz missing" && exit 1)

      - name: Prepare temp upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            UPLOAD_PATH="/tmp/tavern_upload"
            mkdir -p "$UPLOAD_PATH"
            rm -rf "$UPLOAD_PATH"/*

      - name: Upload site tarball to temp dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: ./site.tgz
          target: /tmp/tavern_upload
          overwrite: true
          debug: true

      - name: Atomic swap upload into place
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            # Resolve web root path
            BASE="${{ secrets.DEPLOY_BASE }}"; [ -z "$BASE" ] && BASE="/var/www"
            DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"; [ -z "$DOMAIN" ] && DOMAIN="thedakandchog.xyz"
            REMOTE_PATH="${{ secrets.REMOTE_PATH }}"
            if [ -z "$REMOTE_PATH" ]; then REMOTE_PATH="$BASE/$DOMAIN/html"; fi
            UPLOAD_TGZ="/tmp/tavern_upload/site.tgz"
            echo "Remote web path: $REMOTE_PATH"
            TS=$(date +%s)
            NEW_DIR="${REMOTE_PATH}_new_${TS}"
            mkdir -p "$NEW_DIR"
            echo "Unpacking $UPLOAD_TGZ to $NEW_DIR"
            tar -xzf "$UPLOAD_TGZ" -C "$NEW_DIR"
            # Prune non-web directories we don't need to serve
            rm -rf "$NEW_DIR/.git" "$NEW_DIR/.github" "$NEW_DIR/server" 2>/dev/null || true
            # Atomic swap
            if [ -d "$REMOTE_PATH" ]; then mv "$REMOTE_PATH" "${REMOTE_PATH}_prev_${TS}"; fi
            mv "$NEW_DIR" "$REMOTE_PATH"
            # Fix permissions so Nginx can read (dirs=755, files=644)
            find "$REMOTE_PATH" -type d -exec chmod 755 {} +
            find "$REMOTE_PATH" -type f -exec chmod 644 {} +

      - name: Prune old remote backups (keep last 3)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            BASE="${{ secrets.DEPLOY_BASE }}"; [ -z "$BASE" ] && BASE="/var/www"
            DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"; [ -z "$DOMAIN" ] && DOMAIN="thedakandchog.xyz"
            REMOTE_PATH="${{ secrets.REMOTE_PATH }}"; [ -z "$REMOTE_PATH" ] && REMOTE_PATH="$BASE/$DOMAIN/html"
            cd "$(dirname "$REMOTE_PATH")"
            base="$(basename "$REMOTE_PATH")"
            ls -1dt "${base}_prev_"* 2>/dev/null | tail -n +4 | xargs -r rm -rf

      - name: Verify key files exist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            BASE="${{ secrets.DEPLOY_BASE }}"; [ -z "$BASE" ] && BASE="/var/www"
            DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"; [ -z "$DOMAIN" ] && DOMAIN="thedakandchog.xyz"
            REMOTE_PATH="${{ secrets.REMOTE_PATH }}"; [ -z "$REMOTE_PATH" ] && REMOTE_PATH="$BASE/$DOMAIN/html"
            test -f "$REMOTE_PATH/index.html" && echo "ok index" || (echo "missing index" && exit 1)
            test -f "$REMOTE_PATH/admin/index.html" && echo "ok admin" || (echo "missing admin" && exit 1)
            test -f "$REMOTE_PATH/assets/images/tavern-bg.png" && echo "ok bg" || (echo "missing bg" && exit 1)

      - name: Verify live site (best effort)
        shell: bash
        run: |
          set -e
          DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"; [ -z "$DOMAIN" ] && DOMAIN="thedakandchog.xyz"
          echo "Fetch https://$DOMAIN/assets/build.json"
          for i in {1..6}; do
            if curl -fsS "https://$DOMAIN/assets/build.json" -o build.json; then cat build.json; break; fi
            echo "retry $i"; sleep 2;
          done
          if [ ! -s build.json ]; then
            echo "HTTPS failed, try HTTP"; curl -fsS "http://$DOMAIN/assets/build.json" -o build.json || true
          fi
          test -s build.json && echo "Live build.json present" || echo "Live build.json not accessible"
