name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build metadata
        id: buildmeta
        run: |
          mkdir -p assets
          COMMIT=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"commit\":\"$COMMIT\",\"builtAt\":\"$BUILT_AT\"}" > assets/build.json
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "built_at=$BUILT_AT" >> $GITHUB_OUTPUT

      - name: Prepare upload artifact (exclude dotfiles/repo data)
        run: |
          echo "Creating tarball of site files..."
          tar --exclude-vcs \
              --exclude=.github \
              --exclude=node_modules \
              -czf site.tgz .

      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "site.tgz"
          target: "/tmp/tavern_upload"

      - name: Atomic swap on server
        uses: appleboy/ssh-action@v1.1.0
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN || 'thedakandchog.xyz' }}
          REMOTE_ROOT: ${{ secrets.DEPLOY_BASE || '/var/www' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOMAIN,REMOTE_ROOT
          script: |
            set -euo pipefail
            UPLOAD_TGZ=/tmp/tavern_upload/site.tgz
            BASE_DIR="$REMOTE_ROOT/$DOMAIN"
            WEB_DIR="$BASE_DIR/html"
            NEW_DIR="$BASE_DIR/html_upload"
            echo "Preparing directories at $BASE_DIR"
            sudo mkdir -p "$BASE_DIR" "$NEW_DIR" "$WEB_DIR"
            sudo chown -R $USER:$USER "$BASE_DIR" || true
            rm -rf "$NEW_DIR"/*
            echo "Unpacking upload..."
            tar -xzf "$UPLOAD_TGZ" -C "$NEW_DIR"
            # Ensure basic permissions
            find "$NEW_DIR" -type d -exec chmod 755 {} +
            find "$NEW_DIR" -type f -exec chmod 644 {} +
            TS=$(date +%s)
            echo "Atomic swap: $WEB_DIR -> ${BASE_DIR}/html_prev_${TS}"
            if [ -d "$WEB_DIR" ]; then mv "$WEB_DIR" "${BASE_DIR}/html_prev_${TS}"; fi
            mv "$NEW_DIR" "$WEB_DIR"
            echo "Deployment complete: $WEB_DIR"
            # Optional: restart realtime server if pm2 is present
            if command -v pm2 >/dev/null 2>&1; then
              pm2 describe dakchog-rt >/dev/null 2>&1 && pm2 restart dakchog-rt || true
            fi

      - name: Purge Cloudflare cache (optional)
        if: ${{ secrets.CF_ZONE_ID && secrets.CF_API_TOKEN }}
        uses: fjogeleit/http-request-action@v1
        with:
          url: https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache
          method: POST
          customHeaders: |
            Authorization: Bearer ${{ secrets.CF_API_TOKEN }}
            Content-Type: application/json
          data: '{"purge_everything":true}'

      - name: Summary
        run: |
          echo "Deployed commit ${{ steps.buildmeta.outputs.commit }} at ${{ steps.buildmeta.outputs.built_at }}"

