name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_BASE: ${{ secrets.DEPLOY_BASE || '/var/www' }}
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN || 'thedakandchog.xyz' }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<CFG
          Host deploy-host
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          CFG

      - name: Compute paths and build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse --short HEAD || echo local)
          builtAt=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{"commit":"$commit","builtAt":"$builtAt"}" > assets/build.json
          if [ -n "${REMOTE_PATH}" ]; then
            remote_root="$REMOTE_PATH"
            remote_base="$(dirname "$REMOTE_PATH")"
          else
            remote_base="$DEPLOY_BASE/$DEPLOY_DOMAIN"
            remote_root="$remote_base/html"
          fi
          upload_path="$remote_base/html_upload"
          echo "remote_root=$remote_root" >> $GITHUB_OUTPUT
          echo "remote_base=$remote_base" >> $GITHUB_OUTPUT
          echo "upload_path=$upload_path" >> $GITHUB_OUTPUT
          echo "Commit: $commit  BuiltAt: $builtAt"

      - name: Check remote disk space and prune old backups
        shell: bash
        run: |
          set -euo pipefail
          echo "Remote disk usage before prune:"
          ssh deploy-host "df -h | sed -n '1p;$p'"
          # Prune older html_prev_* backups, keep latest 2 if present
          ssh deploy-host "set -e; base='${{ steps.meta.outputs.remote_base }}'; ls -1dt \"$base\"/html_prev_* 2>/dev/null | tail -n +3 | xargs -r sudo rm -rf"
          echo "Remote disk usage after prune:"
          ssh deploy-host "df -h | sed -n '1p;$p'"

      - name: Prepare remote directories
        shell: bash
        run: |
          set -euo pipefail
          ssh deploy-host "sudo mkdir -p '${{ steps.meta.outputs.upload_path }}' '${{ steps.meta.outputs.remote_root }}' && sudo chown -R ${SSH_USER}:${SSH_USER} '${{ steps.meta.outputs.remote_base }}' && sudo rm -rf '${{ steps.meta.outputs.upload_path }}'/*"

      - name: Upload HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          # HTML files
          shopt -s nullglob
          for f in *.html; do
            scp "$f" deploy-host:'${{ steps.meta.outputs.upload_path }}/'
          done
          # Top-level icons/images (if any)
          for f in *.ico *.png *.jpg *.jpeg *.webp *.svg; do
            [ -e "$f" ] && scp "$f" deploy-host:'${{ steps.meta.outputs.upload_path }}/' || true
          done
          # Directories to upload
          for d in css js img images assets fonts media admin games; do
            [ -d "$d" ] && scp -r "$d" deploy-host:'${{ steps.meta.outputs.upload_path }}/' || true
          done

      - name: Atomic swap into place
        shell: bash
        run: |
          set -euo pipefail
          ssh deploy-host "set -e; ts=\$(date +%s); if [ -d '${{ steps.meta.outputs.remote_root }}' ]; then sudo mv '${{ steps.meta.outputs.remote_root }}' '${{ steps.meta.outputs.remote_base }}/html_prev_'\$ts; fi; sudo mv '${{ steps.meta.outputs.upload_path }}' '${{ steps.meta.outputs.remote_root }}'"
          # Post-swap prune again to prevent backup buildup
          ssh deploy-host "set -e; base='${{ steps.meta.outputs.remote_base }}'; ls -1dt \"$base\"/html_prev_* 2>/dev/null | tail -n +4 | xargs -r sudo rm -rf"

      - name: Fix permissions and verify
        shell: bash
        run: |
          set -euo pipefail
          ssh deploy-host "set -e; sudo find '${{ steps.meta.outputs.remote_root }}' -type d -exec chmod 755 {} +; sudo find '${{ steps.meta.outputs.remote_root }}' -type f -exec chmod 644 {} +; if [ -f '${{ steps.meta.outputs.remote_root }}/admin/index.html' ] && [ -f '${{ steps.meta.outputs.remote_root }}/assets/images/tavern-bg.png' ]; then echo VERIFY_OK; else echo VERIFY_FAIL; exit 1; fi"

      - name: Verify game pages exist
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.meta.outputs.remote_root }}'
          echo "Docroot: ${ROOT}"
          ssh deploy-host "ls -ld '${{ steps.meta.outputs.remote_root }}' || true; ls -l '${{ steps.meta.outputs.remote_root }}/games' || true"
          missing=0
          for p in games/shell/index.html games/hazard/index.html games/table/index.html games/dakchog/index.html; do
            if ssh deploy-host "test -f '${{ steps.meta.outputs.remote_root }}/$p'"; then
              echo "OK $p"
            else
              echo "::error file=$p::Missing $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more game pages are missing under ${ROOT}. Check REMOTE_PATH or upload step."
            exit 1
          fi

      - name: Optional Cloudflare purge
        if: ${{ env.CF_ZONE_ID && env.CF_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true

