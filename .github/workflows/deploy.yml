name: Deploy (Rebuilt)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build metadata
        run: |
          set -e
          mkdir -p assets
          echo "{\"commit\":\"${GITHUB_SHA}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > assets/build.json

      - name: Create site tarball (stable staging)
        run: |
          set -e
          rm -rf site_stage
          mkdir -p site_stage
          git checkout-index -a -f --prefix=site_stage/
          mkdir -p site_stage/assets
          cp -f assets/build.json site_stage/assets/build.json
          tar -czf site.tgz -C site_stage .
          ls -lh site.tgz

      - name: Upload tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: ./site.tgz
          target: /tmp
          overwrite: true
          debug: true

      - name: Atomic release + symlink swap
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            BASE="${{ secrets.DEPLOY_BASE }}"; [ -z "$BASE" ] && BASE="/var/www"
            DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"; [ -z "$DOMAIN" ] && DOMAIN="thedakandchog.xyz"
            ROOT_OVERRIDE="${{ secrets.REMOTE_PATH }}"
            if [ -n "$ROOT_OVERRIDE" ]; then WEB_ROOT="$ROOT_OVERRIDE"; RELEASES_DIR="$(dirname "$ROOT_OVERRIDE")/releases"; else WEB_ROOT="$BASE/$DOMAIN/current"; RELEASES_DIR="$BASE/$DOMAIN/releases"; fi
            mkdir -p "$RELEASES_DIR"
            TS=$(date +%Y%m%d%H%M%S)
            REL="$RELEASES_DIR/$TS"
            echo "Release dir: $REL"
            mkdir -p "$REL"
            echo "Unpacking /tmp/site.tgz to $REL"
            tar -xzf /tmp/site.tgz -C "$REL"
            rm -f /tmp/site.tgz
            find "$REL" -type d -exec chmod 755 {} +
            find "$REL" -type f -exec chmod 644 {} +
            if [ -n "$ROOT_OVERRIDE" ]; then
              echo "ROOT_OVERRIDE in use -> swapping directory"
              if [ -d "$WEB_ROOT" ]; then mv "$WEB_ROOT" "${WEB_ROOT}_prev_$TS"; fi
              mv "$REL" "$WEB_ROOT"
              CUR="$WEB_ROOT"
            else
              ln -sfn "$REL" "$WEB_ROOT"
              CUR="$WEB_ROOT"
            fi
            mkdir -p "$CUR/assets"
            COMMIT=$(echo "${GITHUB_SHA}" | cut -c1-12)
            echo "$COMMIT @ $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$CUR/assets/deploy_check.txt"
            echo "Web root now points to: $CUR"
            ls -la "$(dirname "$CUR")" | sed -n '1,80p'
            ls -la "$CUR" | sed -n '1,80p'

      - name: Purge Cloudflare HTML
        if: ${{ secrets.CF_ZONE_ID && secrets.CF_API_TOKEN }}
        run: |
          set -e
          DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"; [ -z "$DOMAIN" ] && DOMAIN="thedakandchog.xyz"
          BASE="https://$DOMAIN"
          FILES_JSON=$(cat <<EOF
          [
            "$BASE/",
            "$BASE/index.html",
            "$BASE/landing.html",
            "$BASE/admin/index.html",
            "$BASE/games/shell/index.html",
            "$BASE/games/hazard/index.html",
            "$BASE/games/dakchog/index.html",
            "$BASE/games/table/index.html"
          ]
          EOF
          )
          echo "Purging HTML paths on Cloudflare for $DOMAIN"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"files\": $FILES_JSON}"

      - name: Verify live deploy marker
        run: |
          set -e
          DOMAIN="${{ secrets.DEPLOY_DOMAIN }}"; [ -z "$DOMAIN" ] && DOMAIN="thedakandchog.xyz"
          echo "Fetch https://$DOMAIN/assets/deploy_check.txt"
          for i in {1..6}; do
            if curl -fsS "https://$DOMAIN/assets/deploy_check.txt" -o marker.txt; then cat marker.txt; break; fi
            echo "retry $i"; sleep 2;
          done
          test -s marker.txt || (echo "Deploy marker not accessible" && exit 1)

