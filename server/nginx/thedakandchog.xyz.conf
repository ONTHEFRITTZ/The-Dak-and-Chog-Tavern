# /etc/nginx/sites-available/thedakandchog.xyz

# HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name thedakandchog.xyz www.thedakandchog.xyz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # --- FARO realtime (Socket.IO) on :3100 ---
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # --- POKER realtime (Socket.IO) on :3101 ---
  location ^~ /poker.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    proxy_pass http://127.0.0.1:3101/socket.io/;
  }

  # --- Exact-match redirects to add trailing slash ---
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  # --- SPA fallbacks for games (serve their own index.html) ---
  location ^~ /games/faro/  { try_files $uri $uri/ /games/faro/index.html; }
  location ^~ /games/poker/ { try_files $uri $uri/ /games/poker/index.html; }

  # --- No-cache for build markers (prevents stale UI) ---
  location = /assets/build.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # --- Site-wide SPA fallback ---
  location / { try_files $uri $uri/ /index.html; }

  # --- SSL (Let's Encrypt) ---
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
