# The Dak and Chog Tavern — full site + realtime proxy
# Single upstream (Node realtime on :3100) serving both polling and websockets.

# Map is required so we only send Connection: upgrade when $http_upgrade is set.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# (Optional but recommended) name the upstream and keep it alive
upstream rt_backend {
  server 127.0.0.1:3100;
  keepalive 64;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # ========================= Realtime proxy (Engine.IO) =========================
  # We expose BOTH /socket.io/ and /poker.io/ and send them to the same upstream.
  # NOTE: trailing slash on proxy_pass is important to preserve Engine.IO paths.

  location ^~ /socket.io/ {
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    add_header Cache-Control "no-store" always;

    proxy_pass http://rt_backend/socket.io/;
  }

  location ^~ /poker.io/ {
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    add_header Cache-Control "no-store" always;

    proxy_pass http://rt_backend/socket.io/;
  }

  # ============================== SPA routing ==============================
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  location ^~ /games/faro/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/faro/';
    sub_filter 'src="/'  'src="/games/faro/';
    sub_filter_once off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /games/faro/index.html;
  }

  location ^~ /games/poker/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/poker/';
    sub_filter 'src="/'  'src="/games/poker/';
    sub_filter_once off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /games/poker/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # ============================== TLS (LE) ===============================
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}
