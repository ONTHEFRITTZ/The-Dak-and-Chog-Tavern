# ===========================================
# thedakandchog.xyz - FULL Nginx vhost
# CF in front; Node realtime on 127.0.0.1:3100 (/socket.io/)
# Fixes WS by mapping Connection header correctly (no premium CF features needed)
# ===========================================

# Map must be in http{} context (this file is typically included there)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  # Intentionally NO "http2" here to keep CF→origin on HTTP/1.1 (WS-friendly)
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # -------- Socket.IO / WebSocket proxy (public path: /poker.io/) --------
  location ^~ /poker.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # Optional: accept /socket.io/ directly too
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # -------- Canonical SPA redirects (no trailing slash -> with slash) --------
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  # -------- FARO SPA --------
  location ^~ /games/faro/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/faro/';
    sub_filter 'src="/'  'src="/games/faro/';
    sub_filter_once off;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    try_files $uri $uri/ /games/faro/index.html;
  }

  # -------- POKER SPA --------
  location ^~ /games/poker/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/poker/';
    sub_filter 'src="/'  'src="/games/poker/';
    sub_filter_once off;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    try_files $uri $uri/ /games/poker/index.html;
  }

  # -------- Default SPA fallback at root --------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # -------- TLS (Let’s Encrypt) --------
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# Force HTTP->HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name thedakandchog.xyz www.thedakandchog.xyz;
  return 301 https://$host$request_uri;
}
