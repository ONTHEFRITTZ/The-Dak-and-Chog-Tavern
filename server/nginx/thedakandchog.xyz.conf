# Map must live in the HTTP context. Because this file is included from
# /etc/nginx/nginx.conf inside the 'http { ... }' block, it's valid to place it here.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  # ACME HTTP-01 (keep if you renew via certbot)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    allow all;
  }

  # Everything else -> HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # --- TLS (Let's Encrypt) ---
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # --- Common proxy headers ---
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # --- Socket.IO (Poker/Faro realtime) via Cloudflare ---
  # Cloudflare connects to us over HTTPS. We must upgrade to WebSocket to the Node origin.
  location ^~ /poker.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # Optional alias if any code still hits /socket.io/
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # --- SPA niceties ---
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  location ^~ /games/faro/ {
    # HTML cache-bust to avoid stale bundles
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    # Rewrite absolute asset URLs inside HTML (only HTML)
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/faro/';
    sub_filter 'src="/'  'src="/games/faro/';
    sub_filter_once off;

    try_files $uri $uri/ /games/faro/index.html;
  }

  location ^~ /games/poker/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/poker/';
    sub_filter 'src="/'  'src="/games/poker/';
    sub_filter_once off;

    try_files $uri $uri/ /games/poker/index.html;
  }

  # Root SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
