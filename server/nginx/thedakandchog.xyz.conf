# =====================================================================
# thedakandchog.xyz - FULL vhost for site + Socket.IO under /poker.io/
# Works behind Cloudflare (free plan). No subdomains, no CF origin rules.
#
# IMPORTANT:
# - NO "http2" on 443 so Cloudflare uses HTTP/1.1 to origin.
# - /poker.io/ (public) → http://127.0.0.1:3100/socket.io/ (origin).
# - Uses $connection_upgrade (from upgrade_map.conf in http{} on the box).
# =====================================================================

server {
  # Keep Cloudflare -> origin on HTTP/1.1 (no http2 flag here)
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;

  server_name thedakandchog.xyz www.thedakandchog.xyz _;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # Per-server logs for easy debugging
  access_log /var/log/nginx/thedakandchog.access.log;
  error_log  /var/log/nginx/thedakandchog.error.log warn;

  # -------------------- Socket.IO / Poker WS entry --------------------
  # Public path used by your frontend: /poker.io/
  location ^~ /poker.io/ {
    proxy_http_version 1.1;

    # Upgrade only when client asks for it
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Standard forward headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Helpful for verification
    add_header X-WS-Proxy "poker.io" always;

    # Timeouts suitable for WS/long-polling
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Avoid buffering for WS/polling
    proxy_buffering off;

    # Upstream realtime server (Engine.IO/Socket.IO)
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # Optional alias: allow /socket.io/ directly as well
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-WS-Proxy "socket.io" always;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # -------------------- SPA niceties --------------------
  # Exact-match redirect when no trailing slash
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  # FARO SPA
  location ^~ /games/faro/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/faro/';
    sub_filter 'src="/'  'src="/games/faro/';
    sub_filter_once off;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    try_files $uri $uri/ /games/faro/index.html;
  }

  # POKER SPA
  location ^~ /games/poker/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/poker/';
    sub_filter 'src="/'  'src="/games/poker/';
    sub_filter_once off;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    try_files $uri $uri/ /games/poker/index.html;
  }

  # Default app at root
  location / {
    try_files $uri $uri/ /index.html;
  }

  # -------------------- TLS (Let’s Encrypt) --------------------
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# Force HTTP -> HTTPS
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name thedakandchog.xyz www.thedakandchog.xyz _;
  return 301 https://$host$request_uri;
}
