# =====================================================================
# SINGLE-FILE NGINX CONFIG (replace /etc/nginx/nginx.conf with this)
# thedakandchog.xyz behind Cloudflare; Socket.IO served under /poker.io/
#
# One file. No helpers. No includes (except mime.types).
# - NO "http2" on 443 so Cloudflare talks HTTP/1.1 to origin.
# - /poker.io/ (public) → http://127.0.0.1:3100/socket.io/ (origin).
# - Correct Upgrade/Connection mapping via map INSIDE http{}.
# =====================================================================

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # Basic types
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Sensible defaults
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # -------- WebSocket Upgrade mapping (no external helper) --------
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # -------- Main TLS vhost (NO http2) --------
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name thedakandchog.xyz www.thedakandchog.xyz _;

    root /var/www/thedakandchog.xyz/html;
    index index.html landing.html;

    # Per-vhost logs
    access_log /var/log/nginx/thedakandchog.access.log;
    error_log  /var/log/nginx/thedakandchog.error.log warn;

    # ===== Socket.IO under pretty path: /poker.io/ =====
    # Public path → upstream Engine.IO at /socket.io/ on :3100
    location ^~ /poker.io/ {
      proxy_http_version 1.1;

      # Only upgrade when client requests it
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Standard forward headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Helpful for verification
      add_header X-WS-Proxy "poker.io" always;

      # Long timeouts for WS/long-polling
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;

      # Avoid buffering issues with WS/polling
      proxy_buffering off;

      # Upstream realtime server
      proxy_pass http://127.0.0.1:3100/socket.io/;
    }

    # (Optional) Allow /socket.io/ directly as well
    location ^~ /socket.io/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header X-WS-Proxy "socket.io" always;

      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_buffering off;

      proxy_pass http://127.0.0.1:3100/socket.io/;
    }

    # -------- SPA niceties --------
    # Exact-match redirect when no trailing slash
    location = /games/faro  { return 301 /games/faro/; }
    location = /games/poker { return 301 /games/poker/; }

    # FARO SPA
    location ^~ /games/faro/ {
      sub_filter_types text/html;
      sub_filter 'href="/' 'href="/games/faro/';
      sub_filter 'src="/'  'src="/games/faro/';
      sub_filter_once off;

      add_header Cache-Control "no-store, no-cache, must-revalidate" always;

      try_files $uri $uri/ /games/faro/index.html;
    }

    # POKER SPA
    location ^~ /games/poker/ {
      sub_filter_types text/html;
      sub_filter 'href="/' 'href="/games/poker/';
      sub_filter 'src="/'  'src="/games/poker/';
      sub_filter_once off;

      add_header Cache-Control "no-store, no-cache, must-revalidate" always;

      try_files $uri $uri/ /games/poker/index.html;
    }

    # Default SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # -------- TLS (Let’s Encrypt paths as used on your box) --------
    ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
  }

  # -------- HTTP → HTTPS redirect (catch-all) --------
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name thedakandchog.xyz www.thedakandchog.xyz _;
    return 301 https://$host$request_uri;
  }
}
