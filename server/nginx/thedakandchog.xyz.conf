# The Dak and Chog Tavern - unified site + realtime (Faro + Poker)
# This config supports BOTH Engine.IO polling and WebSocket upgrades cleanly
# through Cloudflare → Nginx → Node (server/realtime.js on :3100).

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  # ---- Static root for the web app
  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # ---------------------------------------------------------------------------
  # Realtime (Socket.IO / Engine.IO)
  # We expose TWO public paths for convenience:
  #   /poker.io/   (what the frontend uses)
  #   /socket.io/  (generic alias)
  # Both are proxied to the unified Node process on 127.0.0.1:3100/socket.io/
  # These blocks are tuned for long-polling and websockets (timeouts + no buffering).
  # ---------------------------------------------------------------------------

  # Generic Engine.IO path
  location ^~ /socket.io/ {
    proxy_http_version 1.1;

    # Upgrade (WebSocket) headers; harmless for polling
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    # Forward important headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeouts for polling / ws
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Disable response buffering/caching on this path
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    add_header Cache-Control "no-store" always;

    # IMPORTANT: trailing slash to preserve Engine.IO path semantics
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # Poker alias (same upstream, same tuning)
  location ^~ /poker.io/ {
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    add_header Cache-Control "no-store" always;

    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # ---------------------------------------------------------------------------
  # App routing (SPAs)
  # HTML is marked no-store to avoid users getting stuck on old bundles.
  # ---------------------------------------------------------------------------

  # Exact-match redirects to normalize paths with a trailing slash
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  # Faro SPA
  location ^~ /games/faro/ {
    # Rewrite root-absolute asset links within HTML only
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/faro/';
    sub_filter 'src="/'  'src="/games/faro/';
    sub_filter_once off;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /games/faro/index.html;
  }

  # Poker SPA
  location ^~ /games/poker/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/poker/';
    sub_filter 'src="/'  'src="/games/poker/';
    sub_filter_once off;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /games/poker/index.html;
  }

  # Default SPA fallback (landing app at /)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ---------------------------------------------------------------------------
  # TLS (Let's Encrypt)
  # ---------------------------------------------------------------------------
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# OPTIONAL (recommended when behind Cloudflare): if your distro includes this
# file inside `http { ... }`, uncomment and place it where Nginx will load it.
# It is SAFE to omit if you don't have an include for it.
#
# map $http_upgrade $connection_upgrade {
#   default upgrade;
#   ''      close;
# }
