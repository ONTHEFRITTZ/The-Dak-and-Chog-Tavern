# server/nginx/thedakandchog.xyz.conf
# Site config for The Dak and Chog Tavern

# --- Redirect HTTP → HTTPS ---
server {
  listen 80;
  listen [::]:80;
  server_name thedakandchog.xyz www.thedakandchog.xyz;
  return 301 https://$host$request_uri;
}

# --- Main HTTPS vhost ---
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # =========================
  #   Socket.IO / WebSocket
  # =========================
  # NOTE: unified realtime server listens on 127.0.0.1:3100 AND exposes path /socket.io/
  # We expose TWO public paths for the browser:
  #   - /socket.io/  (generic)
  #   - /poker.io/   (poker client uses this; we map it to /socket.io/ upstream)

  # Generic Socket.IO
  location ^~ /socket.io/ {
    proxy_http_version 1.1;

    # Upgrade headers (safe even when polling)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    # Forwarded headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-polling friendliness
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # IMPORTANT: keep trailing slash to preserve upstream path
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # Poker alias → same upstream path
  location ^~ /poker.io/ {
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # =========================
  #      SPA Sub-apps
  # =========================

  # Exact-match redirects to add trailing slash for SPA subdirs
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  # FARO app
  location ^~ /games/faro/ {
    # Rewrite absolute asset links in HTML only
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/faro/';
    sub_filter 'src="/'  'src="/games/faro/';
    sub_filter_once off;

    # Keep HTML uncached to avoid stale bundles
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    try_files $uri $uri/ /games/faro/index.html;
  }

  # POKER app
  location ^~ /games/poker/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/poker/';
    sub_filter 'src="/'  'src="/games/poker/';
    sub_filter_once off;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    try_files $uri $uri/ /games/poker/index.html;
  }

  # Root SPA fallback (landing app)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # =========================
  #         TLS
  # =========================
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}
