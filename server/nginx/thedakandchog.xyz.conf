# COMPLETE REPLACEMENT VHOST
# Save as: /etc/nginx/sites-available/thedakandchog.xyz
# (and symlink to /etc/nginx/sites-enabled/thedakandchog.xyz)

server {
  # Keep Cloudflare → origin on HTTP/1.1 (NO http2 here)
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # ============== Socket.IO via pretty path: /poker.io/ ==============
  # Public path → upstream Engine.IO mounted at /socket.io/ on :3100
  location ^~ /poker.io/ {
    proxy_http_version 1.1;

    # Conditional WS upgrade (no global helpers/maps)
    proxy_set_header Upgrade   "";
    proxy_set_header Connection "close";
    if ($http_upgrade) {
      proxy_set_header Upgrade   $http_upgrade;   # usually "websocket"
      proxy_set_header Connection "upgrade";
    }

    # Forwarded headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stability for long-polling & WS
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    # *** POINTS TO :3100 (fixes your 3101/refused) ***
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # Optional: allow /socket.io/ directly as well
  location ^~ /socket.io/ {
    proxy_http_version 1.1;

    proxy_set_header Upgrade   "";
    proxy_set_header Connection "close";
    if ($http_upgrade) {
      proxy_set_header Upgrade   $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # ============================ SPA bits =============================
  # Exact-match redirect when no trailing slash
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  # FARO SPA
  location ^~ /games/faro/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/faro/';
    sub_filter 'src="/'  'src="/games/faro/';
    sub_filter_once off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /games/faro/index.html;
  }

  # POKER SPA
  location ^~ /games/poker/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/poker/';
    sub_filter 'src="/'  'src="/games/poker/';
    sub_filter_once off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /games/poker/index.html;
  }

  # Default SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ============================== TLS ===============================
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP → HTTPS redirect
server {
  listen 80;
  listen [::]:80;
  server_name thedakandchog.xyz www.thedakandchog.xyz;
  return 301 https://$host$request_uri;
}
