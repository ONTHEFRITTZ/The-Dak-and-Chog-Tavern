# =====================================================================
# thedakandchog.xyz - SINGLE backend on :3100 for ALL Socket.IO traffic
# Works behind Cloudflare (free plan). No http2 on 443 (forces CF→origin h1).
#
# - Both /poker.io/ and /socket.io/ proxy to localhost:3100/socket.io/
# - Correct Upgrade/Connection handling via $connection_upgrade
# - SPAs served under /, /games/faro/, /games/poker/
# =====================================================================

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # -------------------- Socket.IO (Poker path) --------------------
  location ^~ /poker.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # -------------------- Socket.IO (direct path) --------------------
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # -------------------- SPA redirects --------------------
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  # -------------------- FARO SPA --------------------
  location ^~ /games/faro/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/faro/';
    sub_filter 'src="/'  'src="/games/faro/';
    sub_filter_once off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /games/faro/index.html;
  }

  # -------------------- POKER SPA --------------------
  location ^~ /games/poker/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/poker/';
    sub_filter 'src="/'  'src="/games/poker/';
    sub_filter_once off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /games/poker/index.html;
  }

  # -------------------- Default SPA fallback --------------------
  location / {
    try_files $uri $uri/ /index.html;
  }

  # -------------------- TLS --------------------
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# -------------------- HTTP → HTTPS redirect --------------------
server {
  listen 80;
  listen [::]:80;
  server_name thedakandchog.xyz www.thedakandchog.xyz;
  return 301 https://$host$request_uri;
}
