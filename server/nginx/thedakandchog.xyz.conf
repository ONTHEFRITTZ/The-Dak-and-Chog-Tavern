# =====================================================================
# thedakandchog.xyz - SINGLE backend on :3100 for ALL Socket.IO traffic
# Works behind Cloudflare (free plan). No http2 on 443 (forces CF→origin h1).
#
# Key points:
# - /poker.io/ and /socket.io/ proxy to localhost:3100/socket.io/
# - Static assets (/js, /css, /assets) are served directly (no SPA fallback)
# - SPAs under / and /games/poker/ use index.html fallback
# - Removed sub_filter to avoid rewriting absolute asset URLs
# =====================================================================

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name thedakandchog.xyz www.thedakandchog.xyz;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # --- Content Security Policy (allow app + wallet integrations) ---
  # - Allows same-origin scripts, inline scripts (UI widgets), and esm.sh for dynamic module imports (viem fallback)
  # - Allows XHR/fetch/WebSocket to self, Monad RPC, and ZeroDev bundler
  # - Adjust as needed if you introduce other CDNs/APIs
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline' blob: https://esm.sh; connect-src 'self' https://testnet-rpc.monad.xyz https://rpc.zerodev.app https://indexer.dev.hyperindex.xyz wss://thedakandchog.xyz wss://testnet-rpc.monad.xyz/ws" always;

  # -------------------- Socket.IO (Poker path) --------------------
  location ^~ /poker.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # -------------------- Socket.IO (direct path) --------------------
  # Redirect no-trailing-slash to trailing slash to avoid client path mismatches
  location = /socket.io {
    return 301 /socket.io/;
  }
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # -------------------- Static assets (never SPA-rewrite) --------------------
  location ^~ /js/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }
  location ^~ /css/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # Never cache build.json (drives cache-busting tag)
  location = /assets/build.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  # -------------------- SPA redirects --------------------
  location = /games/poker { return 301 /games/poker/; }

  # -------------------- POKER SPA --------------------
  location ^~ /games/poker/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /games/poker/index.html;
  }

  # -------------------- Default SPA fallback --------------------
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # -------------------- TLS --------------------
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# -------------------- HTTP → HTTPS redirect --------------------
server {
  listen 80;
  listen [::]:80;
  server_name thedakandchog.xyz www.thedakandchog.xyz;
  return 301 https://$host$request_uri;
}
