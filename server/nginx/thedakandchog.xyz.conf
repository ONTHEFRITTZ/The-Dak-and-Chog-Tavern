# =====================================================================
# thedakandchog.xyz - FULL vhost for site + Socket.IO under /poker.io/
# Works behind Cloudflare (free plan). No subdomains, no CF origin rules.
#
# Key fixes:
# - Proper Connection header mapping (polling vs websocket).
# - This server is default_server on 443 so SNI mismatches can’t miss it.
# - Explicit /poker.io/ (public) -> 127.0.0.1:3100/socket.io/ (origin).
# - HTTP/1.1 to upstream, long read/send timeouts.
# - Adds X-WS-Proxy header in WS locations so you can verify the hit.
# =====================================================================

# NOTE: This file is normally included inside the global http{} context.
# The `map` directive must live in http{} (which is true for included vhosts).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  # Keep Cloudflare -> origin on HTTP/1.1 (no "http2" flag here)
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;

  server_name thedakandchog.xyz www.thedakandchog.xyz _;

  root /var/www/thedakandchog.xyz/html;
  index index.html landing.html;

  # Per-server logs to make debugging simpler
  access_log /var/log/nginx/thedakandchog.access.log;
  error_log  /var/log/nginx/thedakandchog.error.log warn;

  # -------------------- Socket.IO / Poker WS entry --------------------
  # Public path used by your frontend: /poker.io/
  location ^~ /poker.io/ {
    proxy_http_version 1.1;

    # Proper upgrade only when client sends Upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Standard forward headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Helpful for debugging
    add_header X-WS-Proxy "poker.io" always;

    # Long-ish timeouts for WS/polling
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Disable buffering to avoid any sticky WS issues
    proxy_buffering off;

    # Upstream realtime server (PM2 "realtime" on :3100)
    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # Optional alias: allow /socket.io/ directly as well
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-WS-Proxy "socket.io" always;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    proxy_pass http://127.0.0.1:3100/socket.io/;
  }

  # -------------------- SPA niceties --------------------
  # Exact-match redirect when no trailing slash
  location = /games/faro  { return 301 /games/faro/; }
  location = /games/poker { return 301 /games/poker/; }

  # FARO SPA
  location ^~ /games/faro/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/faro/';
    sub_filter 'src="/'  'src="/games/faro/';
    sub_filter_once off;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    try_files $uri $uri/ /games/faro/index.html;
  }

  # POKER SPA
  location ^~ /games/poker/ {
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/games/poker/';
    sub_filter 'src="/'  'src="/games/poker/';
    sub_filter_once off;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    try_files $uri $uri/ /games/poker/index.html;
  }

  # Default app at root
  location / {
    try_files $uri $uri/ /index.html;
  }

  # -------------------- TLS (Let’s Encrypt) --------------------
  ssl_certificate     /etc/letsencrypt/live/thedakandchog.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thedakandchog.xyz/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# Force HTTP -> HTTPS
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name thedakandchog.xyz www.thedakandchog.xyz _;
  return 301 https://$host$request_uri;
}

