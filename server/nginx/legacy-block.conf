## NGINX include managed by the repo
# IMPORTANT: Ensure this file is included exactly once in your 443 server {}
# Use: sudo bash scripts/fix-nginx-conf.sh (one-time) to dedupe includes.

# Proxy for isolated Poker realtime on port 3101
location /poker.io/ {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_pass http://127.0.0.1:3101/socket.io/;
}
