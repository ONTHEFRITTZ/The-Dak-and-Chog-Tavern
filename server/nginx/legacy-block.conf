## Include this in your server {} block to hard-cut old paths
## e.g., in /etc/nginx/sites-enabled/thedakandchog.xyz-http.conf inside the 443 server
##   include /var/www/thedakandchog.xyz/html/server/nginx/legacy-block.conf;

# Hard 404 any legacy table paths (we removed /games/table)
location ^~ /games/table/ {
  return 404;
}

# Optional: Socket.IO split paths for Faro and Poker (prep only)
# These routes are safe to include even if you are not yet splitting.
# - Faro continues to work on /socket.io; these add alternative paths /faro.io and /poker.io
# - To actually split, start a second PM2 app on PORT=3101 with GAME_TYPES=POKER
#   and switch Poker clients to path '/poker.io'

# Poker (new path; only used when running a second RT app on 3101)
location /poker.io/ {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_pass http://127.0.0.1:3101/socket.io/;
}
