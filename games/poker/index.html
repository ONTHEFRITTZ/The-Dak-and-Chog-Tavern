<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker (Isolated)</title>
  <link rel="stylesheet" href="../../css/style.css">
  <!-- Preload table + games-table background so lobby->table paints fast -->
  <link rel="preload" as="image" href="../../assets/images/table.png" type="image/png">
  <link rel="preload" as="image" href="../../assets/images/games-table.png" type="image/png">
  <style>
    body { background: #120c08 url('../../assets/images/games-table.png') no-repeat center center fixed; background-size: 100% auto; }
    body.game { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:100vh; }
    .game-logo { display:block; height:auto; max-width: clamp(180px, 26vw, 420px); margin: clamp(12px, 4vh, 28px) auto clamp(10px, 2vh, 18px); filter: drop-shadow(0 0 18px rgba(255,244,233,0.45)) drop-shadow(0 4px 12px rgba(0,0,0,0.25)); pointer-events:none; user-select:none; }
    .lobby-wrap { width:95%; max-width:1000px; margin: clamp(24px, 10vh, 120px) auto 32px; position:relative; }
    .lobby-card { background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:20px; color:#f4e6d3; box-shadow:0 24px 60px rgba(0,0,0,0.55); }
  </style>
</head>

<script>(function(){try{var ok=localStorage.getItem('walletConnected')==='true'||sessionStorage.getItem('walletConnected')==='true';if(!ok) location.replace('/landing.html');}catch(e){location.replace('/landing.html');}})();</script>
<body class="game">
  <div class="top-banner" role="region" aria-label="Wallet and status">
    <div class="banner-left">
      <div id="status" class="banner-status">Connecting...</div>
    </div>
    <div class="banner-right">
      <div class="controls">
      </div>
    </div>
  </div>

  <div class="lobby-wrap">
    <h1 class="visually-hidden">Poker (Isolated)</h1>
    <div class="lobby-card">
      <div id="poker-status" class="muted" style="margin-bottom:8px; font-size:13px; min-height:18px;"></div>
      <div id="lobby" class="lobby-list"></div>
      <div id="table" style="margin-top:14px;"></div>
    </div>
  </div>

  <!-- Wallet + Socket.IO (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module" src="../../js/tavern.js"></script>
  <!-- Load poker.js as a classic script with cache-busting -->
  <script>
    (function(){
      function load(src){ try { var s=document.createElement('script'); s.src=src; s.defer=true; document.body.appendChild(s); } catch(e) { console.error('inject failed', e); } }
      try {
        fetch('/assets/build.json', { cache:'no-store' })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(b){ var tag=(b&&b.commit)? String(b.commit).slice(0,12) : Date.now(); load('poker.js?v='+encodeURIComponent(tag)); })
          .catch(function(){ load('poker.js?v='+Date.now()); });
      } catch(e) { load('poker.js?v='+Date.now()); }
    })();
  </script>
  <!-- Left Sidebar (collapsible) -->
  <script>
    (function(){
      try {
        var t = (window.__BUILD_TAG||Date.now());
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/js/sidebar.js?v=' + encodeURIComponent(t);
        document.body.appendChild(s);
      } catch(e) {}
    })();
  </script>
</body>
</html>
