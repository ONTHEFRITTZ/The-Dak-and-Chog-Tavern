<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Poker Lobby — Dak & Chog</title>

  <!-- Importmap and provider pin for AA -->
  <script type="importmap">
    {
      "imports": {
        "@metamask/delegation-toolkit": "/js/vendor/metamask-delegation-toolkit-latest.mjs",
        "viem": "https://esm.sh/viem@2.38.2",
        "viem/actions": "https://esm.sh/viem@2.38.2/actions",
        "viem/accounts": "https://esm.sh/viem@2.38.2/accounts",
        "viem/chains": "https://esm.sh/viem@2.38.2/chains",
        "viem/utils": "https://esm.sh/viem@2.38.2/utils",
        "viem/account-abstraction": "https://esm.sh/viem@2.38.2/account-abstraction",
        "@alchemy/aa-alchemy": "https://esm.sh/@alchemy/aa-alchemy@4.61.0?bundle&target=es2022"
      }
    }
  </script>
  <script src="../../js/provider-pin.js"></script>
  <script src="/config/paymaster-key.js"></script>
  <script type="module" src="/js/aa/init-all.js"></script>


  <!-- Versioned CSS -->
  <script>
    (async () => {
      try {
        const b = await fetch('/assets/build.json', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : null).catch(() => null);
        const tag = (b && b.commit) ? String(b.commit).slice(0, 12) : Date.now();
        window.__BUILD_TAG = tag;
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = `../../css/style.css?v=${encodeURIComponent(tag)}`;
        document.head.appendChild(css);
      } catch (e) { console.error('poker lobby head loader failed', e); }
    })();
  </script>

  <!-- Preload background -->
  <link rel="preload" as="image" href="../../assets/images/games-room.png" type="image/png" />

  <style>
    /* Page layout: no top banner; wallet chip only */
    body {
      background: #120c08 url('../../assets/images/games-room.png') no-repeat center center fixed !important;
      background-size: 100% auto !important;
    }
    body.game {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 72px; /* space for wallet chip */
    }

    /* Wallet chip */
    #wallet-inline {
      position: fixed; top: 12px; right: 12px; z-index: 12000;
      display: flex; align-items: center; gap: 8px;
      background: var(--panel-bg-soft);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 6px 10px; color: #f4e6d3;
    }
    #wallet-inline button { padding:6px 6px; border-radius:8px; font-size:12px; }

    /* Lobby container */
    .tavern { padding: 0; background: none !important; border: none !important; box-shadow: none !important; }
    .lobby-wrap {
      width: min(96vw, 980px);
      margin: clamp(8px, 4vh, 24px) auto 32px;
    }
    .lobby-card {
      background: var(--panel-bg-soft);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 16px;
      color: #f4e6d3;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
      margin-bottom: 16px;
    }
    h2 { margin: 6px 0 4px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:8px 0; }
    .lobby-list { display:flex; flex-wrap:wrap; gap:10px; }
    .lobby-item {
      flex: 0 1 calc(50% - 10px);
      min-width: 280px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 12px;
      display:flex; justify-content:space-between;
    }
    .lobby-item strong { display:block; margin-bottom:4px; }
    .pill { background: rgba(0,0,0,0.6); color:#fff; padding: 4px 8px; border-radius:999px; font-weight:700; font-size:12px; }
    .muted { opacity:.85; font-size:13px; }
    @media (max-width: 760px) { .lobby-item { flex-basis: 100%; } }

    /* Hide any legacy top-banner if a cached CSS tries to show it */
    .top-banner { display: none !important; }
    .lobby-item {
      align-items: stretch;
      gap: 12px;
    }
    .lobby-item .lobby-cta {
      flex: 0 0 148px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(225,170,90,0.92), rgba(200,120,50,0.92));
      color: #1c1208;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      min-height: 52px;
      text-align: center;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    }
    .lobby-item .lobby-cta:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    .lobby-item .lobby-cta:disabled {
      opacity: 0.65;
      cursor: progress;
      box-shadow: none;
    }
  </style>
</head>

<body class="game">
  <!-- Wallet chip (only element at the top) -->
  <div id="wallet-inline">
     <span id="wi-address">-</span>
    <button id="wi-disconnect" style="display:none;">Disconnect</button>
  </div>

  <!-- STRICT WALLET GATE (consistent with your other pages) -->
  <script>
    ;(() => {
      const next = encodeURIComponent(location.pathname + location.search + location.hash);
      function redirect() { location.replace('/landing.html?next=' + next); }
      function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }
      function persist(addr) {
        try {
          const normalized = typeof addr === 'string' ? addr.toLowerCase() : '';
          if (!/^0x[0-9a-f]{40}$/.test(normalized)) return;
          sessionStorage.setItem('walletConnected', 'true');
          localStorage.setItem('walletConnected', 'true');
          sessionStorage.setItem('walletAddress', normalized);
          localStorage.setItem('walletAddress', normalized);
        } catch {}
      }
      async function resolveProvider(deadline) {
        while (Date.now() < deadline) {
          let provider = null;
          try { if (typeof window.__getSelectedProvider === 'function') provider = window.__getSelectedProvider(); } catch {}
          if (!provider && window.ethereum) provider = window.ethereum;
          if (!provider && window.phantom?.ethereum) provider = window.phantom.ethereum;
          if (provider && typeof provider.request === 'function') return provider;
          await delay(50);
        }
        return null;
      }
      async function requireWallet() {
        const provider = await resolveProvider(Date.now() + 2000);
        if (!provider) return false;
        const accounts = await provider.request({ method: 'eth_accounts' }).catch(() => []);
        if (!Array.isArray(accounts) || !accounts[0] || !/^0x[0-9a-fA-F]{40}$/.test(accounts[0])) return false;
        persist(accounts[0]);
        provider.on?.('accountsChanged', (arr) => {
          if (!Array.isArray(arr) || !arr[0]) redirect();
        });
        provider.on?.('disconnect', redirect);
        return true;
      }
      (async () => {
        if (!(await requireWallet())) redirect();
      })();
    })();
  </script>

  <!-- Lobby -->
  <div class="tavern">
    <div class="lobby-wrap">
      <h1 class="visually-hidden">Poker Lobby</h1>

      <!-- ON-CHAIN LIMIT -->
      <div class="lobby-card" id="sec-onchain-limit">
        <div class="section-head">
          <h2>Texas Hold’em — Limit (3 DCMon / 6 DCMon)</h2>
          <span class="muted" id="oclim-note">loading…</span>
        </div>
        <div id="list-onchain-limit" class="lobby-list"></div>
      </div>

      <!-- ON-CHAIN NO-LIMIT -->
      <div class="lobby-card" id="sec-onchain-nl">
        <div class="section-head">
          <h2>Texas Hold’em — No-Limit</h2>
          <span class="muted" id="ocnl-note">loading…</span>
        </div>
        <div id="list-onchain-nl" class="lobby-list"></div>
      </div>

      <!-- FREE-TO-PLAY -->
      <div class="lobby-card" id="sec-offchain">
        <div class="section-head">
          <h2>Free to Play</h2>
          <span class="muted" id="off-note">loading…</span>
        </div>
        <div id="list-offchain" class="lobby-list"></div>
        <p class="muted" style="margin-top:8px;">Free to play does not require a buy in</p>
      </div>
    </div>
  </div>

  <!-- Helpers + Socket.IO + core -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module" src="../../js/tavern.js"></script>

  <!-- Your lobby logic (unchanged loading pattern) -->
  <script>
    (function(){
      function load(src){
        try{ var s=document.createElement('script'); s.src=src; s.defer=true; document.body.appendChild(s); }
        catch(e){ console.error('inject failed', e); }
      }
      try{
        fetch('/assets/build.json',{cache:'no-store'})
          .then(r=>r.ok?r.json():null)
          .then(b=>{
            var tag=(b&&b.commit)?String(b.commit).slice(0,12):Date.now();
            load('/js/wallet-chips.js?v='+encodeURIComponent(tag));
            load('/js/wallet-sync.js?v='+encodeURIComponent(tag));
            load('/js/bankroll.js?v='+encodeURIComponent(tag));
            load('poker.js?v='+encodeURIComponent(tag));
          })
          .catch(()=>{
            var stamp=Date.now();
            load('/js/wallet-chips.js?v='+stamp);
            load('/js/wallet-sync.js?v='+stamp);
            load('/js/bankroll.js?v='+stamp);
            load('poker.js?v='+stamp);
          });
      }catch{ load('poker.js?v='+Date.now()); }
    })();
  </script>

  <!-- Wallet chip population -->
  <script>
    (function(){
      function short(a){ return (a && a.length > 10) ? (a.slice(0,6)+'...'+a.slice(-4)) : (a||''); }
      function show(addr){
        try {
          const span = document.getElementById('wi-address');
          const disc = document.getElementById('wi-disconnect');
          if (span) span.textContent = short(String(addr||''));
          if (disc) {
            disc.style.display = '';
            disc.onclick = () => {
              try {
                sessionStorage.removeItem('walletConnected');
                localStorage.removeItem('walletConnected');
                sessionStorage.removeItem('walletSigned');
                sessionStorage.removeItem('walletProvider');
                sessionStorage.removeItem('walletMsg');
                sessionStorage.removeItem('walletSig');
              } catch {}
              location.replace('/landing.html');
            };
          }
        } catch {}
      }
      try {
        if (window.userAddress) show(window.userAddress);
        window.addEventListener('wallet:connected', (e)=>{ const a=e?.detail?.address; if(a) show(a); });
        // Passive account check using pinned provider first
        let injected = null;
        try { if (typeof window.__getSelectedProvider === 'function') injected = window.__getSelectedProvider(); } catch {}
        if (!injected && window.ethereum && typeof window.ethereum.request === 'function') injected = window.ethereum;
        if (!injected && window.phantom && window.phantom.ethereum && typeof window.phantom.ethereum.request === 'function') injected = window.phantom.ethereum;
        if (injected && typeof injected.request === 'function' && !window.userAddress) {
          injected.request({ method:'eth_accounts' }).then((acc)=>{ if (acc && acc[0]) show(acc[0]); });
        }
      } catch {}
    })();
  </script>

  <!-- Sidebar only (no network/contract pills) -->
  <script>
    (function(){ try { const t=window.__BUILD_TAG||Date.now(); const s=document.createElement('script'); s.type='module'; s.src='/js/sidebar.js?v='+encodeURIComponent(t); document.body.appendChild(s); } catch {} })();
  </script>
</body>
</html>
