<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>(function(){try{var signed=sessionStorage.getItem('walletSigned')==='true'; if(!signed){ location.replace('/landing.html'); return; }}catch(e){ location.replace('/landing.html'); }})();</script>
  <title>Poker Lobby</title>

  <script>
    (async()=>{
      try{
        const b = await fetch('/assets/build.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
        const tag = (b && b.commit) ? String(b.commit).slice(0,12) : Date.now();
        window.__BUILD_TAG = tag;
        const css = document.createElement('link'); css.rel='stylesheet'; css.href = `../../css/style.css?v=${tag}`;
        document.head.appendChild(css);
      }catch(e){ console.error('poker lobby head loader failed', e); }
    })();
  </script>

  <!-- Preload background for smooth paint -->
  <link rel="preload" as="image" href="../../assets/images/games-room.png" type="image/png" />

  <style>
    /* Force navbar (top-banner) to show on lobby even if global CSS hides it */
    .top-banner { display:flex !important; align-items:center; justify-content:space-between; height:var(--banner-h,80px); padding:0 12px; position:sticky; top:0; z-index:12000; }

    body { background: #120c08 url('../../assets/images/games-room.png') no-repeat center center fixed !important; background-size: 100% auto !important; }
    body.game { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }

    /* When sidebar is present, push content right so it doesn't sit under it */
    body:has(#sidebar) .lobby-wrap { margin-left: calc(var(--sidebar-left, 240px) + 12px); }

    .lobby-wrap { width:95%; max-width:1100px; margin: clamp(8px, 4vh, 24px) auto 32px; position:relative; }
    .lobby-card {
      background: var(--panel-bg-soft);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:14px;
      padding:16px;
      color:#f4e6d3;
      box-shadow:0 24px 60px rgba(0,0,0,0.55);
      margin-bottom:16px;
    }

    h2 { margin: 6px 0 4px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:8px 0; }
    .lobby-list { display:flex; flex-wrap:wrap; gap:10px; }
    .lobby-item {
      flex: 0 1 calc(50% - 10px);
      min-width: 280px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .lobby-item strong { display:block; margin-bottom:4px; }
    .pill { background: rgba(0,0,0,0.6); color:#fff; padding: 4px 8px; border-radius:999px; font-weight:700; font-size:12px; }
    .muted { opacity:.85; font-size:13px; }
    @media (max-width: 760px) {
      .lobby-item { flex-basis: 100%; }
    }
  </style>
</head>

<body class="game">
  <!-- Navbar / top banner kept -->
  <div class="top-banner" role="region" aria-label="Wallet and status">
    <div class="banner-left" style="display:flex; align-items:center; gap:10px;">
      <div id="status" class="banner-status">Connecting...</div>
      <div id="network-banner" class="muted">
        <span class="pill" id="nb-top-info">Monad Testnet</span>
      </div>
    </div>
    <div class="banner-right">
      <div id="wallet-banner" class="controls" style="display:flex; align-items:center; gap:8px;">
        <span title="Connected wallet" id="wb-addr" class="pill">—</span>
        <button id="connect-wallet">Connect</button>
      </div>
    </div>
  </div>

  <div class="lobby-wrap">
    <h1 class="visually-hidden">Poker Lobby</h1>

    <!-- ON-CHAIN LIMIT -->
    <div class="lobby-card" id="sec-onchain-limit">
      <div class="section-head">
        <h2>On-chain Hold’em — Limit (3 MON / 6 MON)</h2>
        <span class="muted" id="oclim-note">loading…</span>
      </div>
      <div id="list-onchain-limit" class="lobby-list"></div>
    </div>

    <!-- ON-CHAIN NO-LIMIT -->
    <div class="lobby-card" id="sec-onchain-nl">
      <div class="section-head">
        <h2>On-chain Hold’em — No-Limit</h2>
        <span class="muted" id="ocnl-note">loading…</span>
      </div>
      <div id="list-onchain-nl" class="lobby-list"></div>
    </div>

    <!-- OFF-CHAIN (sim) -->
    <div class="lobby-card" id="sec-offchain">
      <div class="section-head">
        <h2>Off-chain (Simulated)</h2>
        <span class="muted" id="off-note">loading…</span>
      </div>
      <div id="list-offchain" class="lobby-list"></div>
    </div>
  </div>

  <!-- Wallet helper + Socket.IO -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module" src="../../js/tavern.js"></script>

  <!-- Lobby logic -->
  <script>
    (function(){
      function load(src){
        try{ var s=document.createElement('script'); s.src=src; s.defer=true; document.body.appendChild(s); }
        catch(e){ console.error('inject failed', e); }
      }
      try{
        fetch('/assets/build.json',{cache:'no-store'})
          .then(r=>r.ok?r.json():null)
          .then(b=>{ var tag=(b&&b.commit)?String(b.commit).slice(0,12):Date.now(); load('poker.js?v='+encodeURIComponent(tag)); })
          .catch(()=>load('poker.js?v='+Date.now()));
      }catch{ load('poker.js?v='+Date.now()); }
    })();
  </script>

  <!-- Left Sidebar (collapsible) -->
  <script>
    (function(){
      try {
        var t = (window.__BUILD_TAG||Date.now());
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/js/sidebar.js?v=' + encodeURIComponent(t);
        document.body.appendChild(s);
      } catch(e) {}
    })();
  </script>
</body>
</html>
