<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>(function(){try{if(sessionStorage.getItem('walletSigned')!=='true'){location.replace('/landing.html')}}catch(e){location.replace('/landing.html')}})();</script>
  <title>Poker Lobby</title>

  <script>
    (async()=>{
      try{
        const b = await fetch('/assets/build.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
        const tag = (b && b.commit) ? String(b.commit).slice(0,12) : Date.now();
        window.__BUILD_TAG = tag;
        const css = document.createElement('link');
        css.rel='stylesheet';
        css.href = `../../css/style.css?v=${tag}`;
        document.head.appendChild(css);
      }catch(e){}
    })();
  </script>

  <style>
    body { background:#120c08 url('../../assets/images/games-room.png') no-repeat center center fixed !important; background-size:100% auto !important; }
    body.game { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:100vh; }
    .lobby-wrap { width:95%; max-width:1000px; margin: clamp(24px, 10vh, 120px) auto 32px; position:relative; }
    .lobby-card {
      background: var(--panel-bg-soft);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:14px;
      padding:18px 20px;
      color:#f4e6d3;
      box-shadow:0 24px 60px rgba(0,0,0,0.55);
    }
    .section { margin-top:16px; }
    .section h3 { margin:6px 0 10px; }
    .list { display:flex; flex-direction:column; gap:8px; }
    .row {
      display:flex; align-items:center; gap:10px; justify-content:space-between;
      background: rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:10px 12px;
    }
    .row .meta { font-size:14px; opacity:.95; }
    .row .meta strong { font-weight:900; }
    .row button { font-size:16px; padding:8px 14px; border-radius:10px; background:#9200fa; color:#fff; border:none; cursor:pointer; }
    .row button:hover { background:#7800cd; }
    .muted { font-size:12px; opacity:.9; }
  </style>
</head>

<body class="game">
  <div class="lobby-wrap">
    <div class="lobby-card">
      <h2 style="margin:0 0 6px;">Poker Lobby</h2>
      <div id="poker-status" class="muted" style="min-height:18px; margin-bottom:8px;">Connecting…</div>

      <div class="section">
        <h3>On-chain — Limit (3/6 MON)</h3>
        <div id="list-onchain-limit" class="list"><div class="muted">Loading…</div></div>
      </div>

      <div class="section">
        <h3>On-chain — No-Limit</h3>
        <div id="list-onchain-nolimit" class="list"><div class="muted">Loading…</div></div>
      </div>

      <div class="section">
        <h3>Off-chain (Simulated)</h3>
        <div id="list-offchain" class="list"><div class="muted">Loading…</div></div>
        <div class="muted" style="margin-top:6px;">Note: A test bot may auto-seat only while a single human is at a simulated table. A second human joining removes the bot and resets the hand.</div>
      </div>
    </div>
  </div>

  <!-- Ethers (optional in lobby), Socket.IO, navbar/wallet helper -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module" src="../../js/tavern.js"></script>

  <!-- Poker lobby logic -->
  <script>
  (function(){
    const statusEl = document.getElementById('poker-status');
    const elLimit  = document.getElementById('list-onchain-limit');
    const elNL     = document.getElementById('list-onchain-nolimit');
    const elSim    = document.getElementById('list-offchain');

    function setStatus(t){ try{ if(statusEl) statusEl.textContent=t }catch{} }
    function openTable(id){
      try{
        const u = new URL(window.location.href);
        u.pathname = '/games/poker/table.html';
        u.searchParams.set('table', id);
        window.location.href = u.toString();
      }catch{
        window.location.href = '/games/poker/table.html?table='+encodeURIComponent(id);
      }
    }
    function rowHTML(meta){
      const seated = Number(meta.seated||0), cap = Number(meta.capacity||8);
      const stakes = meta.stakes ? (meta.stakes.sb+'/'+meta.stakes.bb+' '+(meta.stakes.denom||'MON')) : '';
      const betStr = (meta.mode==='onchain' && meta.betting==='limit') ? 'Limit '+stakes
                   : (meta.mode==='onchain' ? 'No-Limit' : 'Sim');
      return `
        <div class="row">
          <div class="meta">
            <strong>${meta.id}</strong> • ${seated}/${cap} seated • ${betStr}
          </div>
          <div><button data-open="${meta.id}">Open</button></div>
        </div>
      `;
    }
    function mountList(el, arr){
      el.innerHTML = (arr && arr.length)
        ? arr.map(rowHTML).join('')
        : '<div class="muted">No tables yet.</div>';
      // wire buttons
      el.querySelectorAll('button[data-open]').forEach(btn=>{
        btn.onclick = ()=> openTable(btn.getAttribute('data-open'));
      });
    }

    let socket;
    try{
      socket = io(window.location.origin, {
        path:'/poker.io/',
        transports:['polling','websocket'], upgrade:true, reconnection:true,
        reconnectionAttempts:10, reconnectionDelay:800, forceNew:true
      });
    }catch(e){ setStatus('Socket.IO unavailable'); return; }

    socket.on('connect', ()=>{ setStatus('Connected'); try{ socket.emit('lobby:get'); }catch{} });
    socket.on('disconnect', ()=> setStatus('Disconnected'));
    socket.on('connect_error', ()=> setStatus('Lobby unavailable. Retrying…'));

    // New grouped payload
    socket.on('lobby:full', (g)=>{
      try{
        mountList(elLimit, g?.onchain?.limit || []);
        mountList(elNL,    g?.onchain?.nolimit || []);
        mountList(elSim,   g?.offchain || []);
      }catch(e){ console.warn(e); }
    });

    // Back-compat (single flat list). We’ll just dump everything into Off-chain.
    socket.on('lobby:list', (list)=>{
      try{
        const arr = Array.isArray(list)?list:[];
        mountList(elSim, arr);
      }catch(e){ console.warn(e); }
    });
  })();
  </script>
</body>
</html>
