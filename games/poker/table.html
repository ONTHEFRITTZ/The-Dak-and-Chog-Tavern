<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Poker Table</title>

  <!-- Pin the user's chosen wallet across the site (must be before any wallet/AA code) -->
  <script src="/js/provider-pin.js"></script>

  <!-- Decide mode early. Only inject the importmap when mode=onchain -->
  <script>
    (function () {
      try {
        const qp = new URL(location.href).searchParams;
        const tag = (qp.get('mode') || '').toLowerCase() === 'onchain' ? 'onchain' : 'f2p';
        document.documentElement.setAttribute('data-table-mode', tag);
        if (tag === 'onchain') {
          const im = document.createElement('script');
          im.type = 'importmap';
          im.text = JSON.stringify({
            imports: {
              "@zerodev/sdk": "https://esm.sh/@zerodev/sdk@4",
              "permissionless": "https://esm.sh/permissionless@0.1.34",
              "viem": "https://esm.sh/viem@2",
              "viem/chains": "https://esm.sh/viem@2/chains",
              "viem/utils": "https://esm.sh/viem@2/utils",
              "viem/actions": "https://esm.sh/viem@2/actions"
            }
          });
          document.currentScript.after(im);
        }
      } catch (e) {
        document.documentElement.setAttribute('data-table-mode', 'f2p');
      }
    })();
  </script>

  <!-- Gate by sign-in -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('walletSigned') !== 'true') {
          location.replace('/landing.html');
        }
      } catch {
        location.replace('/landing.html');
      }
    })();
  </script>

  <!-- versioned CSS -->
  <script>
    (async () => {
      try {
        const b = await fetch('/assets/build.json', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : null).catch(() => null);
        const tag = (b && b.commit) ? String(b.commit).slice(0, 12) : Date.now();
        window.__BUILD_TAG = tag;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `../../css/style.css?v=${encodeURIComponent(tag)}`;
        document.head.appendChild(link);
      } catch (e) { console.error('style load failed', e); }
    })();
  </script>

  <!-- Preloads -->
  <link rel="preload" as="image" href="../../assets/images/poker-table.png" type="image/png">
  <link rel="preload" as="image" href="/assets/images/cards/cards-sprite.png" type="image/png">
  <link rel="preload" as="image" href="/assets/images/chog_cards/dak-and-chog-cardback.png" type="image/png">

  <!-- Holdem ABI helper -->
  <script>
    (function () {
      try {
        var t = window.__BUILD_TAG || Date.now();
        var s = document.createElement('script');
        s.src = '../../js/HoldemPokerABI.js?v=' + encodeURIComponent(t);
        document.head.appendChild(s);
      } catch { }
    })();
  </script>

  <!-- Kill any standalone network banner that might overlap/push layout -->
  <style>
    #network-banner { display:none !important; }
  </style>
</head>

<body class="game">
  <!-- Top-right wallet chip (only thing up top). DevBot button is F2P-only -->
  <div id="wallet-inline" style="position:fixed; top:12px; right:12px; z-index:12000; display:flex; align-items:center; gap:8px; background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:6px 10px; color:#f4e6d3;">
    <span id="wi-label" style="font-weight:700;">Wallet:</span>
    <span id="wi-address">-</span>
    <button id="wi-disconnect" style="display:none">Disconnect</button>
  </div>

  <!-- Table canvas -->
  <div class="table-canvas">
    <div class="table-glow"></div>
    <div class="table-surface"></div>

    <!-- Center messages -->
    <div id="poker-center" class="center-banner" style="display:none"></div>

    <!-- 8 seats – absolutely positioned by table.js -->
    <div class="seat" data-index="0"></div>
    <div class="seat" data-index="1"></div>
    <div class="seat" data-index="2"></div>
    <div class="seat" data-index="3"></div>
    <div class="seat" data-index="4"></div>
    <div class="seat" data-index="5"></div>
    <div class="seat" data-index="6"></div>
    <div class="seat" data-index="7"></div>
  </div>

  <!-- Last hand (debug) -->
  <div id="last-hand">
    <div style="font-weight:700;margin-bottom:6px">Last Hand</div>
    <div id="lh-content"></div>
  </div>

  <!-- Core libs -->
  <script type="module" src="../../js/tavern.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Table logic -->
  <script>
    (function () {
      function load(src) { var s = document.createElement('script'); s.src = src; s.defer = true; document.body.appendChild(s); }
      fetch('/assets/build.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(b => {
        var tag = (b && b.commit ? String(b.commit).slice(0, 12) : Date.now()) + '-' + (b && b.builtAt || Date.now());
        window.__ASSET_TAG = tag;
        load('table.js?v=' + encodeURIComponent(tag));
      }).catch(() => load('table.js?v=' + Date.now()));
    })();
  </script>

  <!-- Agent (only onchain) -->
  <script type="module">
    if (document.documentElement.getAttribute('data-table-mode') === 'onchain') {
      import('../../js/agent-ops.js').catch(() => { });
      import('../../js/agent-sponsor-indicator.js').catch(() => { });
      // (agent-budget merged into ops or omit to avoid 404)
    }
  </script>

  <!-- DevBot (F2P-only): create button only on F2P, hide when another player joins -->
  <script>
    (function () {
      const mode = (document.documentElement.getAttribute('data-table-mode') || 'f2p').toLowerCase();
      if (mode !== 'f2p') return; // never on on-chain

      const walletBar = document.getElementById('wallet-inline');
      if (!walletBar) return;

      const devBtn = document.createElement('button');
      devBtn.id = 'wi-devbot';
      devBtn.title = 'F2P solo only';
      devBtn.style.display = 'none';
      devBtn.textContent = (sessionStorage.getItem('devbotEnabled') === 'true') ? 'Disable DevBot' : 'Enable DevBot';
      walletBar.insertBefore(devBtn, document.getElementById('wi-disconnect'));

      function countPlayers() {
        try {
          let n = 0;
          document.querySelectorAll('.seat .addr').forEach(h => {
            const t = (h.textContent || '').trim();
            if (t && t.toLowerCase() !== 'empty') n++;
          });
          return n;
        } catch { return 0; }
      }

      function updateDevBotVisibility() {
        const players = countPlayers();
        const solo = players <= 1;
        devBtn.style.display = solo ? '' : 'none';
        if (!solo && sessionStorage.getItem('devbotEnabled') === 'true') {
          sessionStorage.removeItem('devbotEnabled');
          devBtn.textContent = 'Enable DevBot';
          window.dispatchEvent(new CustomEvent('devbot:toggle', { detail: { active: false } }));
        }
      }

      const host = document.querySelector('.table-canvas');
      if (host) {
        const mo = new MutationObserver(updateDevBotVisibility);
        mo.observe(host, { childList: true, subtree: true, characterData: true });
      }
      window.addEventListener('load', updateDevBotVisibility);
      window.addEventListener('resize', updateDevBotVisibility);

      devBtn.addEventListener('click', () => {
        const active = sessionStorage.getItem('devbotEnabled') === 'true';
        const next = !active;
        sessionStorage.setItem('devbotEnabled', next ? 'true' : 'false');
        devBtn.textContent = next ? 'Disable DevBot' : 'Enable DevBot';
        window.dispatchEvent(new CustomEvent('devbot:toggle', { detail: { active: next } }));
      });
    })();
  </script>

  <!-- Sidebar pills: network + contract address INSIDE the sidebar footer -->
  <script>
    (function () {
      const CHAIN_ID = 10143;
      const EXPLORER = (window.EXPLORERS && window.EXPLORERS[CHAIN_ID]) || 'https://testnet.monadexplorer.com';

      function short(addr) {
        return (addr && addr.length > 10) ? (addr.slice(0, 6) + '...' + addr.slice(-4)) : (addr || '');
      }

      async function getPokerTableAddress() {
        try {
          if (typeof window.getAddressFor === 'function') {
            const a = await window.getAddressFor('pokerTable');
            if (a) return a;
          }
        } catch {}
        try { return (window.CONTRACTS && window.CONTRACTS.pokerTable) || null; } catch {}
        return null;
      }

      function ensurePill(text, href, cls) {
        const pill = document.createElement('span');
        pill.className = 'pill ' + (cls || '');
        if (href) {
          const a = document.createElement('a');
          a.href = href; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = text;
          pill.appendChild(a);
        } else {
          pill.textContent = text;
        }
        return pill;
      }

      function removeStrayNetworkBanner() {
        const nb = document.getElementById('network-banner');
        if (nb) nb.remove();
      }

      async function mount() {
        // Wait for sidebar footer to exist (sidebar.js loads async)
        const ready = () => document.querySelector('.sidebar .sidebar-footer');
        if (!ready()) {
          const mo = new MutationObserver(() => {
            if (ready()) { mo.disconnect(); mount(); }
          });
          mo.observe(document.documentElement, { childList: true, subtree: true });
          return;
        }

        removeStrayNetworkBanner();

        const footer = ready();
        if (!footer) return;

        // Clean previously injected pills (avoid duplicates on HMR/reloads)
        footer.querySelectorAll('.pill.pill-network, .pill.pill-addr').forEach(n => n.remove());

        // Network pill
        footer.prepend(ensurePill('Monad Testnet', null, 'pill-network'));

        // Contract pill (if resolvable)
        const addr = await getPokerTableAddress();
        if (addr) {
          footer.prepend(ensurePill(short(addr), `${EXPLORER}/address/${addr}`, 'pill-addr'));
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', mount);
      } else {
        mount();
      }
    })();
  </script>

  <!-- Optional sidebar (unchanged) -->
  <script type="module">
    try {
      const t = window.__BUILD_TAG || Date.now();
      import('../../js/sidebar.js?v=' + encodeURIComponent(t));
    } catch { }
  </script>
</body>
</html>
