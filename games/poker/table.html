<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Poker Table - Dak & Chog</title>
  <link rel="icon" type="image/png" href="/assets/images/dakandchog-logo.png" />
  <link id="base-css" rel="stylesheet" href="../../css/style.css" />
  <style>
    body {
      background: #120c08 url('../../assets/images/games-room.png') no-repeat center center fixed !important;
      background-size: 100% auto !important;
    }
  </style>

  <!-- Pin the user's chosen wallet across the site (must be before any wallet/AA code) -->
  <script src="/js/provider-pin.js"></script>

  <!-- Decide mode EARLY (onchain/f2p). Accept ?mode=onchain OR infer from ?table= id. -->
  <script>
    (function () {
      try {
        const u = new URL(location.href);
        const qpMode = (u.searchParams.get('mode') || '').toLowerCase();
        const tableId = (u.searchParams.get('table') || '').toLowerCase();

        function inferFromTable(t) {
          // Treat common onchain table id formats as onchain even if mode is missing
          // e.g. poker-nl-1, poker-limit-2, poker-l-*, holdem-nl-*
          if (!t) return 'f2p';
          const normalized = String(t).toLowerCase();
          if (/poker[-_]?nl[-_]?/i.test(normalized)) return 'onchain';
          if (/poker[-_]?no[-_]?limit/i.test(normalized)) return 'onchain';
          if (/poker[-_]?limit/i.test(normalized)) return 'onchain';
          if (/holdem[-_]?nl/i.test(normalized)) return 'onchain';
          if (/(^|[-_])(nl|no[-_]?limit)([-_]|$)/i.test(normalized)) return 'onchain';
          if (/(^|[-_])(limit|l)([-_]|$)/i.test(normalized)) return 'onchain';
          return 'f2p';
        }

        const mode = qpMode;
        const isLimitMode = /^(limit|l|nolimit|no-?limit|nl)$/i.test(mode);
        const tag = mode === 'onchain'
          ? 'onchain'
          : mode === 'f2p'
            ? 'f2p'
            : isLimitMode
              ? 'onchain'
              : inferFromTable(tableId);

        document.documentElement.setAttribute('data-table-mode', tag);

        // Only inject the importmap when onchain
        if (tag === 'onchain') {
          const im = document.createElement('script');
          im.type = 'importmap';
          im.text = JSON.stringify({
            imports: {
              "@zerodev/sdk": "https://esm.sh/@zerodev/sdk@4",
              "@metamask/delegation-toolkit": "https://esm.sh/@metamask/delegation-toolkit@0.13.0?bundle&target=es2022",
              "permissionless": "https://esm.sh/permissionless@0.1.34",
              "viem": "https://esm.sh/viem@2.31.4",
              "viem/actions": "https://esm.sh/viem@2.31.4/actions",
              "viem/accounts": "https://esm.sh/viem@2.31.4/accounts",
              "viem/chains": "https://esm.sh/viem@2.31.4/chains",
              "viem/utils": "https://esm.sh/viem@2.31.4/utils",
              "viem/account-abstraction": "https://esm.sh/viem@2.31.4/account-abstraction"
            }
          });
          document.currentScript.after(im);
        }
      } catch (e) {
        document.documentElement.setAttribute('data-table-mode', 'f2p');
      }
    })();
  </script>

  <!-- Gate by sign-in (keeps your flow) -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('walletSigned') !== 'true') {
          location.replace('/landing.html');
        }
      } catch {
        location.replace('/landing.html');
      }
    })();
  </script>

  <!-- Require live wallet connection -->
  <script>
    (function () {
      const next = encodeURIComponent(location.pathname + location.search + location.hash);
      function redirect() {
        location.replace('/landing.html?next=' + next);
      }
      function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
      function persist(addr) {
        try {
          const normalized = typeof addr === 'string' ? addr.toLowerCase() : '';
          if (!/^0x[0-9a-f]{40}$/.test(normalized)) return;
          sessionStorage.setItem('walletConnected', 'true');
          localStorage.setItem('walletConnected', 'true');
          sessionStorage.setItem('walletAddress', normalized);
          localStorage.setItem('walletAddress', normalized);
        } catch {}
      }
      async function resolveProvider(deadline) {
        while (Date.now() < deadline) {
          let provider = null;
          try { if (typeof window.__getSelectedProvider === 'function') provider = window.__getSelectedProvider(); } catch {}
          if (!provider && window.ethereum) provider = window.ethereum;
          if (!provider && window.phantom?.ethereum) provider = window.phantom.ethereum;
          if (provider && typeof provider.request === 'function') return provider;
          await delay(50);
        }
        return null;
      }
      (async () => {
        const provider = await resolveProvider(Date.now() + 2000);
        if (!provider) { redirect(); return; }
        const accounts = await provider.request({ method: 'eth_accounts' }).catch(() => []);
        if (!Array.isArray(accounts) || !accounts[0] || !/^0x[0-9a-fA-F]{40}$/.test(accounts[0])) {
          redirect();
          return;
        }
        persist(accounts[0]);
        provider.on?.('accountsChanged', (arr) => {
          if (!Array.isArray(arr) || !arr[0]) redirect();
        });
        provider.on?.('disconnect', redirect);
      })();
    })();
  </script>

  <!-- versioned CSS -->
  <script>
    (async () => {
      try {
        const b = await fetch('/assets/build.json', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : null).catch(() => null);
        const tag = (b && b.commit) ? String(b.commit).slice(0, 12) : Date.now();
        window.__BUILD_TAG = tag;
        const link = document.getElementById('base-css') || document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `../../css/style.css?v=${encodeURIComponent(tag)}`;
        if (!link.parentNode) document.head.appendChild(link);
      } catch (e) { console.error('style load failed', e); }
    })();
  </script>

  <!-- Preloads (poker uses poker-table.png) -->
  <link rel="preload" as="image" href="../../assets/images/poker-table.png" type="image/png" />
  <link rel="preload" as="image" href="../../assets/images/cards/cards-sprite.png" type="image/png" />
  <link rel="preload" as="image" href="../../assets/images/chog_cards/dak-and-chog-cardback.png" type="image/png" />

  <!-- Holdem ABI helper -->
  <script>
    (function () {
      try {
        var t = window.__BUILD_TAG || Date.now();
        var s = document.createElement('script');
        s.src = '../../js/HoldemPokerABI.js?v=' + encodeURIComponent(t);
        document.head.appendChild(s);
      } catch {}
    })();
  </script>

  <!-- DCMon / WMON ABI helpers -->
  <script>
    (function () {
      try {
        var tag = window.__BUILD_TAG || Date.now();
        ['../../js/DCMonABI.js', '../../js/WMONABI.js'].forEach(function (path) {
          var s = document.createElement('script');
          s.src = path + '?v=' + encodeURIComponent(tag);
          document.head.appendChild(s);
        });
      } catch (err) {
        console.error('ABI preload failed', err);
        const chips = document.createElement('script'); chips.defer = true; chips.src = '/js/wallet-chips.js?v=' + Date.now(); document.head.appendChild(chips);
        const sync = document.createElement('script'); sync.defer = true; sync.src = '/js/wallet-sync.js?v=' + Date.now(); document.head.appendChild(sync);
        try {
          const fallback = document.createElement('script'); fallback.defer = true; fallback.src = '../../js/bankroll.js?v=' + Date.now(); document.body.appendChild(fallback);
        } catch {}
      }
    })();
  </script>
</head>

<body class="game">
  <!-- Top-right wallet chip (only thing up top) -->
  <div id="wallet-inline">
    <span id="wi-address">-</span>
    <button id="wi-disconnect" style="display:none">Disconnect</button>
  </div>

  <!-- Table canvas -->
  <div class="table-canvas">
    <div class="table-surface" role="presentation">
      <img src="/assets/images/poker-table.png"
           alt="Poker table surface"
           loading="eager"
           decoding="async"
           draggable="false"
           onerror="this.onerror=null; this.src='../../assets/images/poker-table.png';">
    </div>

    <!-- Center messages -->
    <div id="poker-center" class="center-banner" style="display:none"></div>

    <!-- 8 seats – keep these exactly like this -->
    <div class="seat" data-index="0"></div>
    <div class="seat" data-index="1"></div>
    <div class="seat" data-index="2"></div>
    <div class="seat" data-index="3"></div>
    <div class="seat" data-index="4"></div>
    <div class="seat" data-index="5"></div>
    <div class="seat" data-index="6"></div>
    <div class="seat" data-index="7"></div>
  </div>

  <!-- Last hand recap pill -->
  <div id="last-hand" class="last-hand-pill" style="display:none"><span id="lh-content"></span></div>

  <!-- Core libs -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module">
    (async () => {
      const tag = window.__BUILD_TAG || Date.now();
      try {
        await import(`/js/tavern.js?v=${encodeURIComponent(tag)}`);
      } catch (err) {
        console.error('Failed to load tavern.js', err);
      }
    })();
  </script>

  <!-- Table logic -->
  <script>
    (function () {
      function inject(tag) {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = `./table.js?v=${encodeURIComponent(tag)}`;
        (document.head || document.body || document.documentElement).appendChild(s);
      }
      fetch('/assets/build.json', { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(b => {
          const tag = (b && b.commit ? String(b.commit).slice(0, 12) : Date.now()) + '-' + (b && b.builtAt || Date.now());
          window.__ASSET_TAG = tag;
          inject(tag);
        })
        .catch(() => inject(Date.now()));
    })();
  </script>

  <!-- Agent (only onchain) -->
  <script type="module">
    if (document.documentElement.getAttribute('data-table-mode') === 'onchain') {
      import('../../js/agent-ops.js').catch(() => { });
      import('../../js/agent-sponsor-indicator.js').catch(() => { });
      import('../../js/agent-budget.js').catch(() => { });
    }
  </script>

  <!-- Optional sidebar -->
  <script type="module">
    (async () => {
      const tag = window.__BUILD_TAG || Date.now();
      const importPath = `../../js/sidebar.js?v=${encodeURIComponent(tag)}`;
      try {
        await import(importPath);
      } catch (err) {
        console.warn('sidebar module failed', err);
        const script = document.createElement('script');
        script.defer = true;
        script.src = '/js/sidebar.js?v=' + Date.now();
        const append = () => {
          if (document.body) document.body.appendChild(script);
          else document.addEventListener('DOMContentLoaded', append, { once: true });
        };
        append();
      }
    })();
  </script>

  <!-- Wallet pill sync -->
  <script>
    (function () {
      function short(addr) {
        try {
          return addr && addr.length > 10 ? addr.slice(0, 6) + '...' + addr.slice(-4) : (addr || '');
        } catch { return addr || ''; }
      }

      function savedAddress() {
        try {
          const direct = sessionStorage.getItem('walletAddress') || localStorage.getItem('walletAddress');
          if (direct && /^0x[0-9a-fA-F]{40}$/i.test(direct)) return direct;
        } catch {}
        try {
          const msg = sessionStorage.getItem('walletMsg') || localStorage.getItem('walletMsg') || '';
          const match = msg.match(/Address:\s*(0x[0-9a-fA-F]{40})/i);
          if (match && match[1]) return match[1];
        } catch {}
        return '';
      }

      function render(addr) {
        try {
          const span = document.getElementById('wi-address');
          if (span) span.textContent = short(addr);
          const btn = document.getElementById('wi-disconnect');
          if (btn) {
            btn.style.display = addr ? '' : 'none';
            btn.onclick = function () {
              try {
                localStorage.removeItem('walletConnected');
                sessionStorage.removeItem('walletConnected');
                sessionStorage.removeItem('walletProvider');
                sessionStorage.removeItem('walletMsg');
                sessionStorage.removeItem('walletSig');
              } catch {}
              try { location.replace('/landing.html'); } catch { location.href = '/landing.html'; }
            };
          }
        } catch {}
      }

      try {
        if (window.userAddress) render(String(window.userAddress));
        window.addEventListener('wallet:connected', function (ev) {
          try {
            const addr = String(ev?.detail?.address || '');
            if (addr) render(addr);
          } catch {}
        });

        let provider = null;
        try { if (typeof window.__getSelectedProvider === 'function') provider = window.__getSelectedProvider(); } catch {}
        if (!provider) {
          try { if (window.ethereum?.request) provider = window.ethereum; } catch {}
        }
        if (!provider) {
          try { if (window.phantom?.ethereum?.request) provider = window.phantom.ethereum; } catch {}
        }

        if (provider && !(window.userAddress && String(window.userAddress))) {
          provider.request({ method: 'eth_accounts' })
            .then(function (acc) {
              const addr = Array.isArray(acc) && acc[0] ? String(acc[0]) : '';
              if (addr) { render(addr); return; }
              const saved = savedAddress();
              if (saved) render(saved);
            })
            .catch(function () {
              const saved = savedAddress();
              if (saved) render(saved);
            });
        } else {
          const saved = savedAddress();
          if (saved) render(saved);
        }
      } catch {}
    })();
  </script>

  <script>
    (function () {
      try {
        var tag = window.__BUILD_TAG || Date.now();
        const chips = document.createElement('script'); chips.defer = true; chips.src = '/js/wallet-chips.js?v=' + encodeURIComponent(tag); document.head.appendChild(chips);
        const sync = document.createElement('script'); sync.defer = true; sync.src = '/js/wallet-sync.js?v=' + encodeURIComponent(tag); document.head.appendChild(sync);
        const bankrollScript = document.createElement('script'); bankrollScript.defer = true; bankrollScript.src = '../../js/bankroll.js?v=' + encodeURIComponent(tag); document.body.appendChild(bankrollScript);
      } catch (err) {
        console.error('Poker bankroll helpers failed to load', err);
        try { const chipsFallback = document.createElement('script'); chipsFallback.defer = true; chipsFallback.src = '/js/wallet-chips.js?v=' + Date.now(); document.head.appendChild(chipsFallback); } catch {}
        try { const syncFallback = document.createElement('script'); syncFallback.defer = true; syncFallback.src = '/js/wallet-sync.js?v=' + Date.now(); document.head.appendChild(syncFallback); } catch {}
        try { const bankrollFallback = document.createElement('script'); bankrollFallback.defer = true; bankrollFallback.src = '../../js/bankroll.js?v=' + Date.now(); document.body.appendChild(bankrollFallback); } catch {}
      }
    })();
  </script>
</body>
</html>
