<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Table</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .poker-wrap { position:relative; width:min(92vw, 960px); height:min(92vw, 600px); margin:12px auto; }
    .poker-surface { position:absolute; inset:0; border-radius:24px; background: url('../../assets/images/table.png') no-repeat center / contain, rgba(255,244,233,0.78); box-shadow:0 0 24px rgba(0,0,0,0.2); }
    .seat { position:absolute; width:140px; min-height:84px; border-radius:10px; padding:8px; background:rgba(255,255,255,0.7); border:2px solid #7800cd; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .seat .addr { font-size:12px; color:#2b1e12; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; }
    .seat .btns button { padding:4px 8px; font-size:12px; border-radius:6px; }
    .center-banner { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(255,244,233,0.92); border:3px solid #7800cd; border-radius:12px; padding:10px 12px; color:#2b1e12; min-width:240px; text-align:center; pointer-events:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="top-banner" role="region" aria-label="Wallet and status">
    <div class="banner-left">
      <div id="status" class="banner-status">Connecting...</div>
    </div>
    <div class="banner-right">
      <div class="controls">
        <button id="connect-wallet">Connect Wallet</button>
      </div>
    </div>
  </div>

  <div class="tavern" style="position:relative; width:95%; max-width:1280px; margin:12px auto 28px;">
    <img class="game-logo" src="../../assets/images/texas-holdem-logo.png" alt="Poker">
    <div class="poker-wrap">
      <div class="poker-surface"></div>
      <div id="center" class="center-banner">Table</div>
      <!-- 6 seats around the table (placeholder positions similar to Faro) -->
      <div class="seat" data-index="0" style="left:50%; top:6%; transform:translateX(-50%);"></div>
      <div class="seat" data-index="1" style="left:5%; top:24%;"></div>
      <div class="seat" data-index="2" style="right:5%; top:24%;"></div>
      <div class="seat" data-index="3" style="left:5%; bottom:14%;"></div>
      <div class="seat" data-index="4" style="right:5%; bottom:14%;"></div>
      <div class="seat" data-index="5" style="left:50%; bottom:2%; transform:translateX(-50%);"></div>
    </div>
  </div>

  <!-- Wallet + Socket.IO (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    (function(){
      function load(src){ try { var s=document.createElement('script'); s.src=src; s.defer=true; document.body.appendChild(s); } catch(e) { console.error('inject failed', e); } }
      try { fetch('/assets/build.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(b=>{ var tag=(b&&b.commit)?String(b.commit).slice(0,12):Date.now(); load('table.js?v='+encodeURIComponent(tag)); }).catch(()=> load('table.js?v='+Date.now())); }
      catch(e){ load('table.js?v='+Date.now()); }
    })();
  </script>
</body>
</html>
