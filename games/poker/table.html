<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Table</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* Match Faro table page layout */
    body.game { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
    body { background: url('../../assets/images/tavern-bg.webp') no-repeat center center fixed; background-size: cover; }
    /* Logo sizing and glow consistent with Faro; override any global img rules */
    .game-logo { display:block; width:auto; height:auto; max-width: clamp(180px, 28vw, 420px); margin: 8px auto 12px; filter: drop-shadow(0 0 18px rgba(255,244,233,0.45)) drop-shadow(0 4px 12px rgba(0,0,0,0.25)); pointer-events:none; user-select:none; }
    .tavern { padding-top: 16px; }
    .table-canvas { position:relative; width:min(92vw, 900px); height:min(92vw, 600px); margin: 0 auto; }
    /* Make the table itself pop without filling the container: remove color fill and add a soft backglow */
    .table-surface {
      position:absolute; inset:0; border-radius:24px;
      background: url('../../assets/images/table.webp') no-repeat center / contain;
      box-shadow: none;
    }
    /* Add a radial backglow centered behind the round table only */
    .table-surface::before {
      content: '';
      position: absolute;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 70%; height: 70%; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,244,233,0.55) 0%, rgba(255,244,233,0.18) 45%, rgba(255,244,233,0.05) 65%, rgba(0,0,0,0) 80%);
      filter: blur(6px);
      pointer-events: none;
      z-index: 0;
    }
    .seat { position:absolute; width:120px; height:120px; border-radius:12px; background: rgba(255,255,255,0.5); border:2px solid #7800cd; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:6px; }
    .seat .addr { font-size:12px; color:#2b1e12; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width: 100%; text-align:center; }
    .seat .btns button { padding:4px 8px; font-size:12px; border-radius:6px; }
    .center-banner { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(255,244,233,0.92); border:3px solid #7800cd; border-radius:12px; padding:10px 12px; color:#2b1e12; min-width:240px; text-align:center; pointer-events:none; font-weight:600; }
    /* Card visuals */
    .card { display:block; width:72px; height:auto; border-radius:8px; box-shadow:0 3px 8px rgba(0,0,0,0.25); transform-style:preserve-3d; backface-visibility:hidden; }
    .card--hole { width:60px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.25); }
    .card--flip { transform:rotateY(90deg); transition: transform 260ms ease, box-shadow 200ms ease; }
    .card--flip.card--show { transform:rotateY(0deg); }
    .card--win { box-shadow:0 0 0 2px #ffd166, 0 4px 14px rgba(0,0,0,0.25); transform: translateY(-6px); }
    .win-badge { margin-top:4px; display:inline-block; background:#ffd166; color:#2b1e12; font-weight:700; font-size:11px; padding:2px 6px; border-radius:8px; }
  </style>
</head>

  <script>(function(){try{var ok=(localStorage.getItem('walletConnected')==='true')||(sessionStorage.getItem('walletConnected')==='true'); if(!ok) location.replace('/landing.html');}catch(e){location.replace('/landing.html');}})();</script>
  <div class="top-banner" role="region" aria-label="Wallet and status">
    <div class="banner-left">
      <button id="return" class="return-btn" onclick="location.href='../../index.html'">Return to Tavern</button>
      <div id="status" class="banner-status"></div>
    </div>
    <div class="banner-right">
      <div class="controls">
        <button id="connect-wallet">Connect Wallet</button>
        <button id="toggle-dev-bot" title="Add/remove a test bot to play solo">Dev Bot</button>
      </div>
    </div>
  </div>

  <!-- Logo above the table container -->
  <img class="game-logo" src="../../assets/images/texas-holdem-logo.png" alt="Poker" style="display:block; width:auto; height:auto; max-width: clamp(180px, 28vw, 420px); margin: 8px auto 12px; filter: drop-shadow(0 0 18px rgba(255,244,233,0.45)) drop-shadow(0 4px 12px rgba(0,0,0,0.25));">
  <div class="table-canvas" style="margin:12px auto 28px;">
    <div class="table-surface"></div>
    <!-- 8 seats; positions applied dynamically for even spacing -->
    <div class="seat" data-index="0"></div>
    <div class="seat" data-index="1"></div>
    <div class="seat" data-index="2"></div>
    <div class="seat" data-index="3"></div>
    <div class="seat" data-index="4"></div>
    <div class="seat" data-index="5"></div>
    <div class="seat" data-index="6"></div>
    <div class="seat" data-index="7"></div>
  </div>

  <!-- Wallet banner + auto-connect like Tavern -->
  <script type="module" src="../../js/tavern.js"></script>
  <!-- Socket.IO (CDN) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    (function(){
      function load(src){ try { var s=document.createElement('script'); s.src=src; s.defer=true; document.body.appendChild(s); } catch(e) { console.error('inject failed', e); } }
      try {
        fetch('/assets/build.json',{cache:'no-store'})
          .then(r=>r.ok?r.json():null)
          .then(b=>{
            var tag=(b&&b.commit)?String(b.commit).slice(0,12):Date.now();
            try { window.__ASSET_TAG = tag; } catch(_){ }
            load('table.js?v='+encodeURIComponent(tag));
          })
          .catch(()=> { try { window.__ASSET_TAG = Date.now(); } catch(_){ } load('table.js?v='+Date.now()); });
      }
      catch(e){ try { window.__ASSET_TAG = Date.now(); } catch(_){ } load('table.js?v='+Date.now()); }
    })();
  </script>
</body>
</html>
