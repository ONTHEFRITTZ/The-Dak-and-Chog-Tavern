<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Table</title>
  <link rel="stylesheet" href="../../css/style.css">
  <!-- Preload table surface and room background to ensure they paint immediately -->
  <link rel="preload" as="image" href="../../assets/images/table.png" type="image/png">
  <link rel="preload" as="image" href="../../assets/images/games-room.png" type="image/png">
  <style>
    /* Full-viewport layout; no banner; keep content fully visible */
    body.game {
      --banner-h: 0px;           /* no top banner on this page */
      --panel-top: 72px;         /* safe area for inline wallet panel */
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start; /* anchor from top */
      min-height: 100vh;
      padding-top: var(--panel-top);
      overflow: hidden;           /* avoid accidental page scroll */
    }
    body { background: url('../../assets/images/games-room.png') no-repeat center center fixed; background-size: cover; }
    /* Header row: logo (left) + stats (right) */
    .table-header { display:none; }
    /* Logo sizing and glow consistent with Faro; left aligned inside header */
    .game-logo { display:block; width:auto; height:auto; max-width: clamp(180px, 26vw, 320px); margin: 32px 0 16px 12px; filter: drop-shadow(0 0 18px rgba(255,244,233,0.45)) drop-shadow(0 4px 12px rgba(0,0,0,0.25)); pointer-events:none; user-select:none; }
    .tavern { padding-top: 0; }
    /* Slightly smaller canvas so table + seats fit fully in viewport */
    .table-canvas {
      position:relative;
      width: min(92vw, 860px);
      /* Fit fully below wallet panel; keep a little breathing room */
      height: min(88vw, 560px, calc(100vh - var(--panel-top) - 24px));
      margin: 0 auto;
    }
    @media (max-height: 720px) {
      .table-canvas { height: min(88vw, 520px, calc(100vh - var(--panel-top) - 24px)); }
    }
    @media (max-height: 640px) {
      .table-canvas { height: min(88vw, 480px, calc(100vh - var(--panel-top) - 24px)); }
      .seat { width:100px; height:100px; }
    }
    /* Make the table itself pop without filling the container: remove color fill and add a soft backglow */
    .table-surface {
      position:absolute; inset:0; border-radius:24px; z-index:1;
      background: url('../../assets/images/table.png') no-repeat center / contain;
      box-shadow: none;
    }
    /* Dedicated glow layer sits behind the table image */
    .table-glow { position:absolute; inset:0; pointer-events:none; z-index:0; }
    .table-glow::before {
      content: '';
      position: absolute;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 96%; height: 96%; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,244,233,0.62) 0%, rgba(255,244,233,0.34) 52%, rgba(255,244,233,0.12) 72%, rgba(0,0,0,0) 92%);
      filter: blur(16px);
    }
.seat .addr { font-size:12px; color:#f4e6d3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width: 100%; text-align:center; }
    .seat .btns button { padding:4px 8px; font-size:12px; border-radius:6px; }
    .center-banner { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:16px 18px; color:#f4e6d3; box-shadow:0 24px 60px rgba(0,0,0,0.55); min-width:240px; text-align:center; pointer-events:none; font-weight:600; }
        .seat {
      position:absolute;
      z-index:2;
      width:110px;
      height:110px;
      border-radius:16px;
      background: var(--panel-bg-soft);
      border:1px solid rgba(255,255,255,0.18);
      box-shadow:0 0 26px rgba(255,180,60,0.28);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:8px;
    }/* Card visuals */
    .card { display:block; width:72px; height:auto; border-radius:8px; box-shadow:0 3px 8px rgba(0,0,0,0.25); transform-style:preserve-3d; backface-visibility:hidden; }
    .card--hole { width:60px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.25); }
    .card--flip { transform:rotateY(90deg); transition: transform 260ms ease, box-shadow 200ms ease; }
    .card--flip.card--show { transform:rotateY(0deg); }
    .card--win { box-shadow:0 0 0 2px #ffd166, 0 4px 14px rgba(0,0,0,0.25); transform: translateY(-6px); }
    .win-badge { margin-top:4px; display:inline-block; background:#ffd166; color:#2b1e12; font-weight:700; font-size:11px; padding:2px 6px; border-radius:8px; }

    /* Compact stats box (opposite corner from logo) */
    .stats-box {
      position: fixed;
      left: calc(var(--sidebar-left, 240px) + 12px);
      bottom: 12px;
      z-index: 9000;
      background: var(--panel-bg-soft);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      padding:12px 14px;
      color:#f4e6d3;
      text-align:left;
      box-shadow:0 12px 32px rgba(0,0,0,0.35);
      min-width:200px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .stats-box .label { font-weight:700; margin-right:4px; }
  </style>
 </head>
 <body class="game">
  <script>(function(){try{var ok=(localStorage.getItem('walletConnected')==='true')||(sessionStorage.getItem('walletConnected')==='true'); if(!ok) location.replace('/landing.html');}catch(e){location.replace('/landing.html');}})();</script>
  <!-- Inline wallet panel (no banner) -->
  <div id="wallet-inline" style="position:fixed; top:12px; right:12px; z-index:12000; display:flex; align-items:center; gap:8px; background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:6px 10px; color:#f4e6d3;">
    <span id="wi-label" style="font-weight:700;">Wallet:</span>
    <span id="wi-address">-</span>
    <button id="wi-disconnect" style="display:none;">Disconnect</button>
    <button id="toggle-dev-bot" title="Add/remove a test bot to play solo" style="display:none;">Dev Bot</button>
  </div>

  <!-- Header row: logo (left) + stats (right) -->
  <div class="table-header">
    <div id="stats-box" class="stats-box">
      <div><span class="label">Wallet:</span><span id="sb-wallet">—</span></div>
      <div><span class="label">Chips:</span><span id="sb-chips">0</span></div>
      <div><span class="label">PNL:</span><span id="sb-pnl">0</span></div>
      <div><span class="label">Hands Won:</span><span id="sb-hands">0</span></div>
    </div>
  </div>
  <div class="table-canvas" style="margin:0 auto;">
    <div class="table-glow"></div>
    <div class="table-surface"></div>
    <!-- 8 seats; positions applied dynamically for even spacing -->
    <div class="seat" data-index="0"></div>
    <div class="seat" data-index="1"></div>
    <div class="seat" data-index="2"></div>
    <div class="seat" data-index="3"></div>
    <div class="seat" data-index="4"></div>
    <div class="seat" data-index="5"></div>
    <div class="seat" data-index="6"></div>
    <div class="seat" data-index="7"></div>
  </div>

  <!-- Wallet banner + auto-connect like Tavern -->
  <script type="module" src="../../js/tavern.js"></script>
  <!-- Socket.IO (CDN) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <!-- Prewarm table background in cache before JS/paint -->
  <script>try{(new Image()).src='../../assets/images/table.png';}catch(e){}</script>
  <script>
    (function(){
      function load(src){ try { var s=document.createElement('script'); s.src=src; s.defer=true; document.body.appendChild(s); } catch(e) { console.error('inject failed', e); } }
      try {
        fetch('/assets/build.json',{cache:'no-store'})
          .then(r=>r.ok?r.json():null)
          .then(b=>{
            var tag=(b&&b.commit)?String(b.commit).slice(0,12):Date.now();
            try { window.__ASSET_TAG = tag; } catch(_){ }
            load('table.js?v='+encodeURIComponent(tag));
          })
          .catch(()=> { try { window.__ASSET_TAG = Date.now(); } catch(_){ } load('table.js?v='+Date.now()); });
      }
      catch(e){ try { window.__ASSET_TAG = Date.now(); } catch(_){ } load('table.js?v='+Date.now()); }
    })();
  </script>
  <!-- Left Sidebar (collapsible) -->
  <script>
    (function(){
      try {
        var t = (window.__BUILD_TAG||Date.now());
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/js/sidebar.js?v=' + encodeURIComponent(t);
        document.body.appendChild(s);
      } catch(e) {}
    })();
  </script>
</body>
</html>
