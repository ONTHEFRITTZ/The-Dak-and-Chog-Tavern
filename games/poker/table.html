<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Poker Table</title>

  <!-- Pin the user's chosen wallet across the site (must be before any wallet/AA code) -->
  <script src="../../js/provider-pin.js?v=20251001a"></script>

  <!-- Decide mode EARLY (onchain/f2p). Accept ?mode=onchain OR infer from ?table= id. -->
  <script>
    (function () {
      try {
        const u = new URL(location.href);
        const qpMode = (u.searchParams.get('mode') || '').toLowerCase();
        const tableId = (u.searchParams.get('table') || '').toLowerCase();

        function inferFromTable(t) {
          // Treat common onchain table id formats as onchain even if mode is missing
          // e.g. poker-nl-1, poker-limit-2, poker-l-*, holdem-nl-*
          if (/poker[-_]?nl[-_]?/i.test(t)) return 'onchain';
          if (/poker[-_]?no[-_]?limit/i.test(t)) return 'onchain';
          if (/poker[-_]?limit/i.test(t)) return 'onchain';
          if (/holdem[-_]?nl/i.test(t)) return 'onchain';
          return 'f2p';
        }

        const tag = qpMode === 'onchain' ? 'onchain'
                  : qpMode === 'f2p'     ? 'f2p'
                  : inferFromTable(tableId);

        document.documentElement.setAttribute('data-table-mode', tag);

        // Only inject the importmap when onchain
        if (tag === 'onchain') {
          const im = document.createElement('script');
          im.type = 'importmap';
          im.text = JSON.stringify({
            imports: {
              "@zerodev/sdk": "https://esm.sh/@zerodev/sdk@4",
              "permissionless": "https://esm.sh/permissionless@0.1.34",
              "viem": "https://esm.sh/viem@2",
              "viem/chains": "https://esm.sh/viem@2/chains",
              "viem/utils": "https://esm.sh/viem@2/utils",
              "viem/actions": "https://esm.sh/viem@2/actions"
            }
          });
          document.currentScript.after(im);
        }
      } catch (e) {
        document.documentElement.setAttribute('data-table-mode', 'f2p');
      }
    })();
  </script>

  <!-- Gate by sign-in (keeps your flow) -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('walletSigned') !== 'true') {
          location.replace('/landing.html');
        }
      } catch {
        location.replace('/landing.html');
      }
    })();
  </script>

  <!-- versioned CSS -->
  <script>
    (async () => {
      try {
        const b = await fetch('/assets/build.json', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : null).catch(() => null);
        const tag = (b && b.commit) ? String(b.commit).slice(0, 12) : Date.now();
        window.__BUILD_TAG = tag;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `../../css/style.css?v=${encodeURIComponent(tag)}`;
        document.head.appendChild(link);
      } catch (e) { console.error('style load failed', e); }
    })();
  </script>

  <!-- Preloads (poker uses poker-table.png) -->
  <link rel="preload" as="image" href="../../assets/images/poker-table.png" type="image/png">
  <link rel="preload" as="image" href="/assets/images/cards/cards-sprite.png" type="image/png">
  <link rel="preload" as="image" href="/assets/images/chog_cards/dak-and-chog-cardback.png" type="image/png">

  <!-- Holdem ABI helper -->
  <script>
    (function () {
      try {
        var t = window.__BUILD_TAG || Date.now();
        var s = document.createElement('script');
        s.src = '../../js/HoldemPokerABI.js?v=' + encodeURIComponent(t);
        document.head.appendChild(s);
      } catch { }
    })();
  </script>

  <!-- HARD LOCK: DevBot must never show on onchain tables -->
  <style>
    html[data-table-mode="onchain"] #wi-devbot {
      display: none !important;
      visibility: hidden !important;
    }
  </style>
</head>

<body class="game">
  <!-- Top-right wallet chip (only thing up top). DevBot button is F2P solo only -->
  <div id="wallet-inline">
    <span id="wi-label">Wallet:</span>
    <span id="wi-address">-</span>
    <button id="wi-devbot" style="display:none" title="F2P solo only">Enable DevBot</button>
    <button id="wi-disconnect" style="display:none">Disconnect</button>
  </div>

  <!-- Extra guard: if page is ONCHAIN, nuke any attempt to show or recreate DevBot -->
  <script>
    (function () {
      try {
        if (document.documentElement.getAttribute('data-table-mode') === 'onchain') {
          const kill = () => {
            const b = document.getElementById('wi-devbot');
            if (b) b.remove();
          };
          kill();
          const mo = new MutationObserver(kill);
          mo.observe(document.body, { childList: true, subtree: true, attributes: true });
        }
      } catch {}
    })();
  </script>

  <!-- Table canvas -->
  <div class="table-canvas">
    <div class="table-glow"></div>
    <div class="table-surface"></div>

    <!-- Center messages -->
    <div id="poker-center" class="center-banner" style="display:none"></div>

    <!-- 8 seats – absolutely positioned by table.js -->
    <div class="seat" data-index="0"></div>
    <div class="seat" data-index="1"></div>
    <div class="seat" data-index="2"></div>
    <div class="seat" data-index="3"></div>
    <div class="seat" data-index="4"></div>
    <div class="seat" data-index="5"></div>
    <div class="seat" data-index="6"></div>
    <div class="seat" data-index="7"></div>
  </div>

  <!-- Last hand (debug) -->
  <div id="last-hand">
    <div style="font-weight:700;margin-bottom:6px">Last Hand</div>
    <div id="lh-content"></div>
  </div>

  <!-- Core libs -->
  <script type="module" src="../../js/tavern.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Table logic -->
  <script>
    (function () {
      function load(src) { var s = document.createElement('script'); s.src = src; s.defer = true; document.body.appendChild(s); }
      fetch('/assets/build.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(b => {
        var tag = (b && b.commit ? String(b.commit).slice(0, 12) : Date.now()) + '-' + (b && b.builtAt || Date.now());
        window.__ASSET_TAG = tag;
        load('table.js?v=' + encodeURIComponent(tag));
      }).catch(() => load('table.js?v=' + Date.now()));
    })();
  </script>

  <!-- Agent (only onchain) -->
  <script type="module">
    if (document.documentElement.getAttribute('data-table-mode') === 'onchain') {
      import('../../js/agent-ops.js').catch(() => { });
      import('../../js/agent-sponsor-indicator.js').catch(() => { });
      import('../../js/agent-budget.js').catch(() => { });
    }
  </script>

  <!-- Optional sidebar -->
  <script type="module">
    try {
      const t = window.__BUILD_TAG || Date.now();
      import('../../js/sidebar.js?v=' + encodeURIComponent(t)).then(() => {
        // If any network/contract pills are rendered outside the footer, relocate them.
        const movePills = () => {
          const footer = document.querySelector('.sidebar-footer');
          if (!footer) return;
          const maybePills = [
            document.getElementById('network-banner'),
            document.getElementById('nb-top-info'),
            document.querySelector('[data-network-pill]'),
          ].filter(Boolean);
          maybePills.forEach(el => { if (!footer.contains(el)) footer.appendChild(el); });
        };
        movePills();
        // Re-try a couple times in case sidebar paints later
        setTimeout(movePills, 200);
        setTimeout(movePills, 800);
      });
    } catch { }
  </script>
</body>
</html>
