<!DOCTYPE html>

<head>

  <title>Poker Table</title>

  <!-- Pin the user's chosen wallet across the site (inline to avoid CDN rewrites) -->
  <script>
    (function () {
      try {
        const lc = (v) => String(v || '').toLowerCase();
        const readPref = () => {
          try { return lc(sessionStorage.getItem('walletProvider') || localStorage.getItem('walletProvider')); }
          catch { return ''; }
        };
        const savePref = (v) => {
          try {
            sessionStorage.setItem('walletProvider', lc(v));
            localStorage.setItem('walletProvider', lc(v));
          } catch {}
        };

        function pickProvider() {
          const pref = readPref();
          const phantom = window?.phantom?.ethereum;
          const eth = window.ethereum;

          if (pref === 'phantom' && phantom) return { name: 'phantom', provider: phantom };
          if (pref === 'metamask' && eth) return { name: 'metamask', provider: eth };

          if (phantom && !eth) return { name: 'phantom', provider: phantom };
          if (eth && !phantom) return { name: 'metamask', provider: eth };

          if (eth?.isMetaMask) return { name: 'metamask', provider: eth };
          if (phantom) return { name: 'phantom', provider: phantom };
          if (eth) return { name: 'metamask', provider: eth };

          return { name: '', provider: null };
        }

        const choice = pickProvider();
        window.walletChoice = {
          name: choice.name,
          provider: choice.provider,
          save: savePref
        };
        window.__getSelectedProvider = function () { return window.walletChoice?.provider || null; };

        try {
          window.ethereum = choice.provider || window.ethereum;
        } catch {}

        function watch(accountsProvider, tag) {
          if (!accountsProvider || typeof accountsProvider.on !== 'function') return;
          try {
            accountsProvider.on('accountsChanged', (accs) => {
              if (Array.isArray(accs) && accs[0]) savePref(tag);
            });
          } catch {}
        }
        watch(choice.provider, choice.name);
        watch(window?.phantom?.ethereum, 'phantom');
        watch(window.ethereum, 'metamask');

        window.dispatchEvent(new CustomEvent('wallet:provider:pinned', {
          detail: { pinned: !!choice.provider, name: choice.name }
        }));
      } catch {}
    })();
  </script>

  <!-- Decide mode EARLY (onchain/f2p). Accept ?mode=onchain OR infer from ?table= id. -->
  <script>
    (function () {
      try {
        const u = new URL(location.href);
        const qpMode = (u.searchParams.get('mode') || '').toLowerCase();
        const tableId = (u.searchParams.get('table') || '').toLowerCase();

        function inferFromTable(t) {
          // Treat common onchain table id formats as onchain even if mode is missing
          // e.g. poker-nl-1, poker-limit-2, poker-l-*, holdem-nl-*
          if (/poker[-_]?nl[-_]?/i.test(t)) return 'onchain';
          if (/poker[-_]?no[-_]?limit/i.test(t)) return 'onchain';
          if (/poker[-_]?limit/i.test(t)) return 'onchain';
          if (/holdem[-_]?nl/i.test(t)) return 'onchain';
          return 'f2p';
        }

        const tag = qpMode === 'onchain' ? 'onchain'
                  : qpMode === 'f2p'     ? 'f2p'
                  : inferFromTable(tableId);

        document.documentElement.setAttribute('data-table-mode', tag);

        // Only inject the importmap when onchain
        if (tag === 'onchain') {
          const im = document.createElement('script');
          im.type = 'importmap';
          im.text = JSON.stringify({
            imports: {
              "@zerodev/sdk": "https://esm.sh/@zerodev/sdk@4",
              "permissionless": "https://esm.sh/permissionless@0.1.34",
              "viem": "https://esm.sh/viem@2",
              "viem/chains": "https://esm.sh/viem@2/chains",
              "viem/utils": "https://esm.sh/viem@2/utils",
              "viem/actions": "https://esm.sh/viem@2/actions"
            }
          });
          document.currentScript.after(im);
        }
      } catch (e) {
        document.documentElement.setAttribute('data-table-mode', 'f2p');
      }
    })();
  </script>

  <!-- Gate by sign-in (keeps your flow) -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('walletSigned') !== 'true') {
          location.replace('/landing.html');
        }
      } catch {
        location.replace('/landing.html');
      }
    })();
  </script>

  <!-- versioned CSS -->
  <script>
    (async () => {
      try {
        const b = await fetch('/assets/build.json', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : null).catch(() => null);
        const tag = (b && b.commit) ? String(b.commit).slice(0, 12) : Date.now();
        window.__BUILD_TAG = tag;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `../../css/style.css?v=${encodeURIComponent(tag)}`;
        document.head.appendChild(link);
      } catch (e) { console.error('style load failed', e); }
    })();
  </script>

    <button id="wi-disconnect" style="display:none">Disconnect</button>

<!-- Table canvas -->

         alt="Poker table surface"
         loading="eager"
         decoding="async"
         draggable="false"

  <!-- Center messages -->

  <!-- Core libs -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module">
    (async () => {
      const tag = window.__BUILD_TAG || Date.now();
      try {
        await import(`/js/tavern.js?v=${encodeURIComponent(tag)}`);
      } catch (err) {
        console.error('Failed to load tavern.js', err);
      }
    })();
  </script>

  <!-- Table logic -->
  <script>
    (function () {
      function inject(tag) {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = `./table.js?v=${encodeURIComponent(tag)}`;
        document.body.appendChild(s);
      }
      fetch('/assets/build.json', { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(b => {
          const tag = (b && b.commit ? String(b.commit).slice(0, 12) : Date.now()) + '-' + (b && b.builtAt || Date.now());
          window.__ASSET_TAG = tag;
          inject(tag);
        })
        .catch(() => inject(Date.now()));
    })();
  </script>

  <!-- Agent (only onchain) -->
  <script type="module">
    if (document.documentElement.getAttribute('data-table-mode') === 'onchain') {
      import('../../js/agent-ops.js').catch(() => { });
      import('../../js/agent-sponsor-indicator.js').catch(() => { });
      import('../../js/agent-budget.js').catch(() => { });
    }
  </script>

  <!-- Optional sidebar -->
  <script type="module">
    try {
      const t = window.__BUILD_TAG || Date.now();
      import('../../js/sidebar.js?v=' + encodeURIComponent(t)).then(() => {
        // If any network/contract pills are rendered outside the footer, relocate them.
        const movePills = () => {
          const footer = document.querySelector('.sidebar-footer');
          if (!footer) return;
          const maybePills = [
            document.getElementById('network-banner'),
            document.getElementById('nb-top-info'),
            document.querySelector('[data-network-pill]'),
          ].filter(Boolean);
          maybePills.forEach(el => { if (!footer.contains(el)) footer.appendChild(el); });
        };
        movePills();
        // Re-try a couple times in case sidebar paints later
        setTimeout(movePills, 200);
        setTimeout(movePills, 800);
      });
    } catch { }
  </script>

  <!-- On-chain extras: MON balance + sponsored gas note under wallet pill -->
  <script type="module">
    (function () {
      if (document.documentElement.getAttribute('data-table-mode') !== 'onchain') return;
      try {
        const pill = document.getElementById('wallet-inline');
        if (!pill) return;
        let row = document.getElementById('wi-extra');
        if (!row) {
          row = document.createElement('div');
          row.id = 'wi-extra';
          row.style.cssText = 'display:flex;gap:8px;align-items:center;justify-content:flex-end;width:100%;font-size:12px;opacity:.95;';
          pill.appendChild(row);
        }
        let bal = document.getElementById('wi-balance');
        if (!bal) { bal = document.createElement('span'); bal.id = 'wi-balance'; bal.title = 'MON Balance'; row.appendChild(bal); }
        let note = document.getElementById('wi-sponsor');
        if (!note) { note = document.createElement('span'); note.id = 'wi-sponsor'; note.style.color = '#9ef89e'; row.appendChild(note); }

        function fmt(x){ try { const n = Number(x); if (!Number.isFinite(n)) return ''; if (n>=1) return n.toFixed(3); return n.toFixed(5); } catch { return ''; } }

        async function refreshBalance(){
          try {
            const addr = (sessionStorage.getItem('walletAddress') || localStorage.getItem('walletAddress') || '').toLowerCase();
            if (!addr) return;
            const ethers = window.ethers || (await import('https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.esm.min.js')).ethers;
            let prov = null;
            try { prov = window.__getSelectedProvider ? window.__getSelectedProvider() : null; } catch {}
            if (!prov && window.ethereum) prov = window.ethereum;
            if (!prov) return;
            const provider = new ethers.providers.Web3Provider(prov, 'any');
            const wei = await provider.getBalance(addr);
            const mon = Number(ethers.utils.formatEther(wei));
            bal.textContent = mon ? (fmt(mon) + ' MON') : '';
          } catch {}
        }

        function updateSponsor(e){ try { note.textContent = e?.detail?.active ? 'Gas sponsored by The Dak & Chog' : ''; } catch {} }

        window.addEventListener('aa:sponsored', updateSponsor);
        refreshBalance();
        setTimeout(refreshBalance, 2500);
        setInterval(refreshBalance, 30000);
      } catch {}
    })();
  </script>

  <!-- Wallet pill sync -->
  <script>
    (function () {
      function short(addr) {
        try {
          return addr && addr.length > 10 ? addr.slice(0, 6) + '...' + addr.slice(-4) : (addr || '');
        } catch { return addr || ''; }
      }

      function savedAddress() {
        try {
          const direct = sessionStorage.getItem('walletAddress') || localStorage.getItem('walletAddress');
          if (direct && /^0x[0-9a-fA-F]{40}$/i.test(direct)) return direct;
        } catch {}
        try {
          const msg = sessionStorage.getItem('walletMsg') || localStorage.getItem('walletMsg') || '';
          const match = msg.match(/Address:\s*(0x[0-9a-fA-F]{40})/i);
          if (match && match[1]) return match[1];
        } catch {}
        return '';
      }

      function render(addr) {
        try {
          const span = document.getElementById('wi-address');
          if (span) span.textContent = short(addr);
          const btn = document.getElementById('wi-disconnect');
          if (btn) {
            btn.style.display = addr ? '' : 'none';
            btn.onclick = function () {
              try {
                localStorage.removeItem('walletConnected');
                sessionStorage.removeItem('walletConnected');
                sessionStorage.removeItem('walletProvider');
                sessionStorage.removeItem('walletMsg');
                sessionStorage.removeItem('walletSig');
              } catch {}
              try { location.replace('/landing.html'); } catch { location.href = '/landing.html'; }
            };
          }
        } catch {}
      }

      try {
        if (window.userAddress) render(String(window.userAddress));
        window.addEventListener('wallet:connected', function (ev) {
          try {
            const addr = String(ev?.detail?.address || '');
            if (addr) render(addr);
          } catch {}
        });

        let provider = null;
        try { if (typeof window.__getSelectedProvider === 'function') provider = window.__getSelectedProvider(); } catch {}
        if (!provider) {
          try { if (window.ethereum?.request) provider = window.ethereum; } catch {}
        }
        if (!provider) {
          try { if (window.phantom?.ethereum?.request) provider = window.phantom.ethereum; } catch {}
        }

        if (provider && !(window.userAddress && String(window.userAddress))) {
          provider.request({ method: 'eth_accounts' })
            .then(function (acc) {
              const addr = Array.isArray(acc) && acc[0] ? String(acc[0]) : '';
              if (addr) { render(addr); return; }
              const saved = savedAddress();
              if (saved) render(saved);
            })
            .catch(function () {
              const saved = savedAddress();
              if (saved) render(saved);
            });
        } else {
          const saved = savedAddress();
          if (saved) render(saved);
        }
      } catch {}
    })();
  </script>
