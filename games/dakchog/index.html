<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Dak & Chog - The Dak and Chog Tavern</title>

  <!-- Pin the user's chosen wallet across the site (must be before any wallet/AA code) -->
  <script src="/js/provider-pin.js"></script>

  <!-- Gate by sign-in -->
  <script>
    (function () {
      try {
        var signed = sessionStorage.getItem('walletSigned') === 'true';
        if (!signed) { location.replace('/landing.html'); return; }
      } catch (e) { location.replace('/landing.html'); }
    })();
  </script>

  <!-- Load versioned CSS & core scripts -->
  <script>
    (async () => {
      try {
        const b = await fetch('/assets/build.json', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : null).catch(() => null);
        const tag = (b && b.commit) ? String(b.commit).slice(0, 12) : Date.now();
        window.__BUILD_TAG = tag;

        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = `../../css/style.css?v=${tag}`;
        document.head.appendChild(css);

        const e = document.createElement('script');
        e.src = 'https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js';
        document.head.appendChild(e);

        const poolAbi = document.createElement('script');
        poolAbi.src = `../../js/PoolABI.js?v=${tag}`;
        document.head.appendChild(poolAbi);

        const dakAbi = document.createElement('script');
        dakAbi.src = `../../js/DakChogABI.js?v=${tag}`;
        document.head.appendChild(dakAbi);

        const s1 = document.createElement('script');
        s1.type = 'module';
        s1.src = `../../js/tavern.js?v=${tag}`;
        document.head.appendChild(s1);

        const s2 = document.createElement('script');
        s2.type = 'module';
        s2.src = `../../js/state.js?v=${tag}`;
        document.head.appendChild(s2);
      } catch (e) { console.error('head loader failed', e); }
    })();
  </script>

  <style>
    /* Lock page to viewport and remove scroll */
    html, body { height: 100%; overflow: hidden; }
    body.game { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height: 100vh; height: 100vh; }
    body { background: url('../../assets/images/tavern-bg.png') no-repeat center center fixed; background-size: cover; }
    .top-banner .banner-left { gap: 12px; }

    .game-header { width:95%; max-width:1280px; margin:0 auto 8px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .game-logo { display:block; width:auto; height:auto; max-width: clamp(180px, 26vw, 320px); margin:16px 0 6px 12px; filter: drop-shadow(0 0 18px rgba(255,244,233,0.45)) drop-shadow(0 4px 12px rgba(0,0,0,0.25)); pointer-events:none; user-select:none; }

    .game-header .rules-btn {
      background: url('../../assets/images/nav-gem.png') no-repeat center / 100% 100%;
      border:none; color:#fff; font-weight:700; font-family:'Morris','Morris Alt',serif;
      text-shadow:0 1px 2px rgba(0,0,0,0.45); height:2.4em; padding:0 18px; cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .game-header .rules-btn:hover { transform: translateY(-1px); }

    /* Tight container: don't span full width; wrap around game content */
    .tavern { padding: 0; background: none !important; border: none !important; box-shadow: none !important; }
    .coin-wrap { width: min(92vw, 560px); margin: 0 auto; }

    .coin-wrap {
      display:flex; flex-direction:column; align-items:center; gap:10px;
      background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12);
      border-radius:18px; padding:14px 16px; color:#f4e6d3;
      box-shadow:0 24px 60px rgba(0,0,0,0.55);
    }
    .coin {
      width: clamp(140px, 24vw, 240px);
      height: clamp(140px, 24vw, 240px);
      background-image:url('../../assets/images/coin-dak.png');
      background-position:center; background-repeat:no-repeat; background-size: contain; box-shadow:none;
    }
    .coin.flip { animation: flip 0.8s ease; }
    .coin.spin { animation: flip 0.6s linear infinite; }
    @keyframes flip {
      0% { transform: rotateY(0deg); }
      25% { transform: rotateY(90deg); }
      50% { transform: rotateY(180deg); }
      75% { transform: rotateY(270deg); }
      100% { transform: rotateY(360deg); }
    }

    .choice { display:flex; align-items:center; justify-content:center; gap:6px; }
    .choice button {
      background: url('../../assets/images/nav-gem.png') no-repeat center / 100% 100%;
      border:none; color:#fff; font-weight:700; font-family:'Morris','Morris Alt',serif;
      text-shadow:0 1px 2px rgba(0,0,0,0.45); height:2.6em; padding:0 16px; cursor:pointer;
      box-shadow:0 0 20px rgba(255,244,233,0.28);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .choice button:hover { transform: translateY(-1px); box-shadow:0 0 26px rgba(255,244,233,0.32); }
    .choice button.active {
      box-shadow:0 0 0 2px rgba(255,255,255,0.4), 0 0 28px rgba(255,244,233,0.35);
      transform: translateY(-1px) scale(1.03);
    }

    .controls label { color:#f4e6d3; text-shadow:0 1px 2px rgba(0,0,0,0.45); }
    .controls input { border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(26,14,8,0.7); color:#f4e6d3; box-shadow: inset 0 1px 1px rgba(255,255,255,0.12); }
    .cta { text-align:center; margin-top:8px; }
  </style>
</head>

<body class="game">
  <!-- Inline wallet panel (no banner) -->
  <div id="wallet-inline" style="position:fixed; top:12px; right:12px; z-index:12000; display:flex; align-items:center; gap:8px; background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:6px 10px; color:#f4e6d3;">
     <span id="wi-address">-</span>
    <button id="wi-disconnect" style="display:none;">Disconnect</button>
  </div>

  
  <div class="game-header"><!-- (rules btn removed) --></div>

  <div class="tavern" style="position:relative; width:min(92vw, 660px); margin:0 auto;">
    <h1 class="visually-hidden">Dak &amp; Chog</h1>

    <div class="coin-wrap">
      <div id="coin" class="coin" aria-live="polite"></div>
      <div class="choice" aria-label="Choose side">
        <button id="choose-dak" data-side="dak">Dak</button>
        <button id="choose-chog" data-side="chog">Chog</button>
      </div>
      <div class="controls" style="margin-top:6px;">
        <label>Bet (DCMon)</label>
        <input id="bet" type="number" min="0.001" step="0.001" value="0.001" style="width:110px; text-align:center;">
      </div>
      <div class="cta">
        <button id="flip">Flip</button>
      </div>
      <div id="dc-status" style="min-height:28px; text-align:center;"></div>
    </div>
  </div>

  <!-- Page logic -->
  <script type="module">
    (async () => {
      try {
        const b = await fetch('/assets/build.json', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : null).catch(() => null);
        const tag = (b && b.commit) ? String(b.commit).slice(0, 12) : Date.now();
        await import(`./dakchog.js?v=${tag}`);
      } catch (e) { console.error('dakchog import failed', e); }
    })();
  </script>

  <!-- Inline wallet sync for Dak & Chog page -->
  <script>
    (function () {
      function short(a) { try { return (a && a.length > 10) ? (a.slice(0,6) + '...' + a.slice(-4)) : (a || ''); } catch { return a || ''; } }
      try {
        var disconnectBtn = document.getElementById('wi-disconnect');
        var walletAddrSpan = document.getElementById('wi-address');
        function show(addr){
          try { if (walletAddrSpan) walletAddrSpan.textContent = short(String(addr||'')); } catch{}
          try {
            if (disconnectBtn) {
              disconnectBtn.style.display = '';
              disconnectBtn.onclick = function () {
                try {
                  sessionStorage.removeItem('walletSigned');
                  sessionStorage.removeItem('walletProvider');
                  sessionStorage.removeItem('walletMsg');
                  sessionStorage.removeItem('walletSig');
                } catch (_) {}
                try { location.replace('/landing.html'); } catch (_) {}
              };
            }
          } catch {}
        }
        if (window.userAddress && String(window.userAddress)) { show(window.userAddress); }
        window.addEventListener('wallet:connected', function (ev) {
          try {
            var a = String((ev && ev.detail && ev.detail.address) || '');
            if (a) show(a);
          } catch {}
        });
        // Passive check using selected provider; fallback to signed message
        (function () {
          try {
            var pref = (sessionStorage.getItem('walletProvider') || '').toLowerCase();
            var injected = (pref === 'phantom') ? (window.phantom && window.phantom.ethereum) : window.ethereum;
            if (injected && typeof injected.request === 'function' && !(window.userAddress && String(window.userAddress))) {
              injected.request({ method: 'eth_accounts' }).then(function (acc) {
                var a = (acc && acc[0]) ? String(acc[0]) : '';
                if (a) show(a);
              }).catch(function(){});
            } else {
              try {
                var msg = sessionStorage.getItem('walletMsg') || '';
                var m = msg.match(/Address:\s*(0x[a-fA-F0-9]{40})/);
                if (m && m[1]) show(m[1]);
              } catch (_){}
            }
          } catch (_){}
        })();
      } catch {}
    })();
  </script>

  <!-- Left Sidebar (collapsible) -->
  <script>
    (function(){
      try {
        var t = (window.__BUILD_TAG || Date.now());
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/js/sidebar.js?v=' + encodeURIComponent(t);
        document.body.appendChild(s);
      } catch(e) {}
    })();
  </script>

  <!-- Build footer: shows Version + Commit + Built time -->
  <div style="position:fixed; right:12px; bottom:12px; z-index:10000;">
    <div id="footer-meta" style="font-size:12px; color:#f4e6d3; opacity:.95; background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:6px 8px; display:inline-block; box-shadow:0 18px 40px rgba(0,0,0,0.45);">
      Loading build info...
    </div>
  </div>
  <script>
    (function(){
      async function text(u){ try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) return null; return await r.text(); }catch{return null} }
      async function json(u){ try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) return null; return await r.json(); }catch{return null} }
      (async()=>{
        const el=document.getElementById('footer-meta'); if(!el) return;
        try{
          const ver=(await text('/assets/version.txt')||'').trim();
          const b=await json('/assets/build.json');
          const c=b?.commit?String(b.commit).slice(0,12):'unknown';
          const at=b?.builtAt||new Date().toISOString();
          el.textContent=`Version: ${ver||'n/a'} | Commit: ${c} | Built: ${at}`;
        }catch{ el.textContent='Version info unavailable'; }
      })();
    })();
  </script>
  <script>
    (function () {
      try {
        var tag = window.__BUILD_TAG || Date.now();
        ['wallet-chips','bankroll'].forEach(function(name){
          var el = document.createElement('script');
          el.defer = true;
          el.src = name === 'wallet-chips'
            ? '/js/wallet-chips.js?v=' + encodeURIComponent(tag)
            : '/js/bankroll.js?v=' + encodeURIComponent(tag);
          document.head.appendChild(el);
        });
      } catch (err) {
        try {
          var chips = document.createElement('script'); chips.defer = true; chips.src = '/js/wallet-chips.js?v=' + Date.now(); document.head.appendChild(chips);
          var bankroll = document.createElement('script'); bankroll.defer = true; bankroll.src = '/js/bankroll.js?v=' + Date.now(); document.head.appendChild(bankroll);
        } catch {}
      }
    })();
  </script>
</body>
</html>
