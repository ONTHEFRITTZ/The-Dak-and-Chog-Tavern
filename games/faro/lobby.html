<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faro Lobby</title>
  <script>
    (async()=>{
      try{
        const b = await fetch('/assets/build.json', { cache:'no-store' }).then(r=>r.ok?r.json():null).catch(()=>null);
        const tag = (b && b.commit) ? String(b.commit).slice(0,12) : Date.now();
        window.__BUILD_TAG = tag;
        const css = document.createElement('link'); css.rel='stylesheet'; css.href = `../../css/style.css?v=${tag}`; document.head.appendChild(css);
      }catch(e){ console.error('head loader failed', e); }
    })();
  </script>
  <style>
    body { background: url('../../assets/images/tavern-bg.webp') no-repeat center center fixed; background-size: cover; }
    /* Stack and center: logo on top, lobby centered on page */
    body.game {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height: 100vh;
      padding-top: 48px; /* reduce space above logo versus default banner spacing */
    }
    /* Place logo above container with a soft backglow (match Hazard sizing) */
    .game-logo {
      display:block; height:auto; max-width: clamp(180px, 26vw, 420px);
      margin: 4px auto 18px; /* tighter above, a bit more space below */
      filter: drop-shadow(0 0 18px rgba(255,244,233,0.45)) drop-shadow(0 4px 12px rgba(0,0,0,0.25));
      pointer-events:none; user-select:none;
    }
    .lobby-wrap { width:95%; max-width:1000px; margin:12px auto 28px; position:relative; display:block; clear:both; }
    .lobby-card { background: var(--panel-bg-soft); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:20px; color:#f4e6d3; box-shadow:0 24px 60px rgba(0,0,0,0.55); }
    .lobby-list { display:flex; flex-wrap:wrap; gap:10px; }
    .lobby-item { background:rgba(30,16,10,0.85); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:10px; min-width:220px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .lobby-item .name.full { opacity:.55; }
  </style>
</head>

  <script>(function(){try{var ok=localStorage.getItem('walletConnected')==='true'||sessionStorage.getItem('walletConnected')==='true';if(!ok) location.replace('/landing.html');}catch(e){location.replace('/landing.html');}})();</script>
  <div class="top-banner" role="region" aria-label="Wallet and status">
    <div class="banner-left">
      <button id="return" class="return-btn">Return to Tavern</button>
      <div id="status" class="banner-status"></div>
    </div>
    <div class="banner-right">
      <div class="controls">
      </div>
    </div>
  </div>

  <img class="game-logo" src="../../assets/images/faro-logo.png" alt="Faro">
  <div class="tavern lobby-wrap">
    <div class="lobby-card">
      <h2 style="margin:6px 0 10px;">Faro Lobby</h2>
      <div id="lobby-list" class="lobby-list">
        <div style="opacity:.7; font-size:13px;">Connecting to lobby…</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js" onerror="(function(){var s=document.createElement('script');s.src='https://cdn.socket.io/4.7.5/socket.io.min.js';document.head.appendChild(s);})();"></script>
  <script type="module" src="../../js/tavern.js"></script>
  <script type="module">
    (async()=>{
      try { const tag = window.__BUILD_TAG || Date.now(); const s=document.createElement('script'); s.type='module'; s.src=`lobby.js?v=${encodeURIComponent(tag)}`; document.body.appendChild(s); } catch(e) { console.error('faro lobby boot failed', e); }
    })();
  </script>
</body>
</html>
