specVersion: "1.0.0"
name: the-dak-and-chog-tavern
description: Tavern activity indexer for staking rewards (hosted build)

networks:
  - id: 10143
    name: monad-testnet
    rpc_url: https://monad-testnet.drpc.org

contracts:
  - name: HoldemPoker
    address: "0x424F89FE230331df8f656B683812b6394c323f17"
    abi: ./abis/poker-events.json

entities:
  - Activity

schema: ./schema.graphql

mappings:
  language: javascript
  file: ./src/mapping.js
  abis:
    - name: HoldemPoker
      file: ./abis/poker-events.json
  eventHandlers:
    - contract: HoldemPoker
      event: SeatTaken(address indexed player, uint8 indexed seat, uint256 amount)
      handler: handleSeatTaken
    - contract: HoldemPoker
      event: SeatLeft(address indexed player, uint8 indexed seat, uint256 returnedAmount)
      handler: handleSeatLeft
    - contract: HoldemPoker
      event: Joined(address indexed player, uint8 indexed seat)
      handler: handleJoined
    - contract: HoldemPoker
      event: LeftDuringHand(address indexed player, uint8 indexed seat)
      handler: handleLeftDuringHand
    - contract: HoldemPoker
      event: HandStarted(uint256 indexed handId, uint8 dealer, uint8 sb, uint8 bb)
      handler: handleHandStarted
    - contract: HoldemPoker
      event: Contributed(uint256 indexed handId, uint8 indexed seat, uint256 amount)
      handler: handleContributed
    - contract: HoldemPoker
      event: HandSettled(uint256 indexed handId, address[] winners, uint256[] payouts, uint256 rake)
      handler: handleHandSettled

startBlock: latest-50000
