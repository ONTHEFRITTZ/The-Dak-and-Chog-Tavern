<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Activity - Dak & Chog</title>
<link rel="stylesheet" href="/css/style.css" />
<script src="/js/envio-config.js"></script>
<style>body{color:#f4e6d3;background:#120c08}.wrap{width:min(96vw,900px);margin:24px auto;background:var(--panel-bg-soft);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,0.55)}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.list{display:flex;flex-direction:column;gap:6px}.row{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:8px}.event{font-weight:700}.muted{opacity:.9;font-size:12px}.addr{font-family:monospace;font-size:12px}</style>
</head>
<body>
<div class="wrap">
<div class="head">
<h2 style="margin:0">Your Activity</h2>
<span id="addr" class="addr"></span>
</div>
<div id="status" class="muted">Loading...</div>
<div id="list" class="list"></div>
</div>
<script type="module">
const qs=new URL(window.location.href).searchParams;let address=(qs.get("addr")||"").toLowerCase();if(!/^0x[0-9a-f]{40}$/.test(address)){try{const a=sessionStorage.getItem("walletAddress")||localStorage.getItem("walletAddress")||"";if(a)address=a.toLowerCase()}catch{}}document.getElementById("addr").textContent=address?address:"(address unavailable)";const status=document.getElementById("status"),listEl=document.getElementById("list");function short(a){return a&&a.length>10?a.slice(0,6)+"..."+a.slice(-4):a||""}async function load(){try{const mod=await import("/js/envio-activity.js");let tableAddress="";try{const tag=window.__BUILD_TAG||Date.now();const cfg=await import(`/js/config.js?v=${encodeURIComponent(tag)}`);tableAddress=cfg&&cfg.CONTRACTS&&cfg.CONTRACTS.pokerTable||""}catch{}const items=await mod.fetchRecentEvents({endpoint:mod.getEnvioUrl(),tableAddress,limit:100});const addr=String(address||"").toLowerCase();const mine=(items||[]).filter(ev=>{try{const from=(ev.player||ev.from||ev.args?.player||ev.args?.from||"").toString().toLowerCase();const to=(ev.to||ev.args?.to||"").toString().toLowerCase();return from&&addr&&from===addr||to&&addr&&to===addr}catch{return false}});if(!mine.length){status.textContent="No recent activity for this address.";return}status.textContent=`${mine.length} events`;mine.slice(0,100).forEach(ev=>{const row=document.createElement("div");row.className="row";const when=document.createElement("span");when.className="muted";let ts=ev.blockTimestamp||ev.timestamp||ev.time||0;try{if(typeof ts==="string")ts=Date.parse(ts)/1000}catch{}const dt=ts?new Date(ts*1000):new Date;when.textContent=dt.toLocaleString();const what=document.createElement("span");what.className="event";what.textContent=ev.event||ev.name||ev.type||"event";const who=document.createElement("span");who.className="muted";const from=(ev.args?.player||ev.args?.from||ev.from||"").toString();const to=(ev.args?.to||ev.to||"").toString();who.textContent=(from?short(from):"")+(to?" ? "+short(to):"");row.appendChild(when);row.appendChild(what);row.appendChild(who);listEl.appendChild(row)})}catch(e){status.textContent="Failed to load activity."}}load();
</script>
</body>
</html>
